<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コリドール">
<meta name="theme-color" content="#faf9f5">
<meta name="description" content="2人で遊べる戦略ボードゲーム コリドール">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<title>コリドール</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&f[]=satoshi@400,500,700&display=swap');

:root {
  --color-ink: #0b0b0d; --color-ink-muted: #666;
  --color-cream: #faf9f5; --color-sand: #f0ebe3;
  --color-green: #2d6a4f; --color-green-light: #40916c;
  --color-red: #c1272d; --color-red-light: #d64045;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --radius-xl: 24px; --radius-2xl: 32px;
  --transition-smooth: 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  --transition-snappy: 0.2s cubic-bezier(0.17,0.67,0.83,0.67);
  --bg: #faf9f5; --text: #0b0b0d; --text-dim: #888;
  --panel-bg: rgba(255,255,255,0.75); --panel-border: rgba(11,11,13,0.08);
  --p1: #2d6a4f; --p1-light: #40916c; --p2: #c1272d; --p2-light: #d64045;
  --board-bg: #f0ebe3; --board-border: rgba(11,11,13,0.06);
  --wall-color: #0b0b0d; --move-color: #2d6a4f; --title-color: #0b0b0d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Satoshi', 'Zen Kaku Gothic New', sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  overflow: hidden;
}

/* Grain texture */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 256px 256px;
  opacity: 0.03; pointer-events: none; z-index: 9998;
}
/* Subtle accent glow */
body::after {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(45,106,79,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

#app {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  padding: calc(8px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));
  width: 100%; max-width: 600px; height: 100vh; height: 100dvh;
  overflow: visible; position: relative; z-index: 1;
}

.player-zone { width: 100%; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.player-zone.p2-zone { transform: rotate(180deg); }

/* --- Player Panels --- */
.player-panel {
  width: 100%; padding: 10px 14px; border-radius: var(--radius-lg);
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  transition: all var(--transition-smooth); position: relative; overflow: hidden;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.player-panel::before {
  content: ''; position: absolute; top: 8px; left: 0; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0; opacity: 0; transition: opacity var(--transition-smooth);
}
.player-panel.p1::before { background: var(--p1); }
.player-panel.p2::before { background: var(--p2); }
.player-panel.active::before { opacity: 1; }
.player-panel.active.p1 { border-color: rgba(45,106,79,0.2); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
.player-panel.active.p2 { border-color: rgba(193,39,45,0.2); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }

.panel-row { display: flex; align-items: center; gap: 8px; }
.player-icon {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
  font-family: 'Clash Display', sans-serif;
}
.player-icon.p1 { background: var(--p1); }
.player-icon.p2 { background: var(--p2); }
.player-name {
  font-size: clamp(0.7rem, 2vw, 0.85rem); font-weight: 700; color: var(--text);
  white-space: nowrap; letter-spacing: 2px; text-transform: uppercase;
  font-family: 'Clash Display', sans-serif;
}
.turn-badge {
  display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 2px 8px;
  border-radius: var(--radius-sm); margin-left: 4px; opacity: 0;
  transition: opacity var(--transition-snappy); letter-spacing: 1px; flex-shrink: 0;
  font-family: 'Satoshi', sans-serif;
}
.player-panel.active .turn-badge { opacity: 1; }
.player-panel.p1 .turn-badge { background: rgba(45,106,79,0.1); color: var(--p1); border: none; }
.player-panel.p2 .turn-badge { background: rgba(193,39,45,0.1); color: var(--p2); border: none; }

.wall-indicators { display: flex; gap: 3px; align-items: center; margin-left: auto; }
.wall-pip {
  width: 6px; height: 6px; border-radius: 50%;
  transition: all var(--transition-snappy);
}
.player-panel.p1 .wall-pip { background: var(--p1); }
.player-panel.p2 .wall-pip { background: var(--p2); }
.wall-pip.used { background: var(--panel-border) !important; opacity: 0.4; }
.wall-label {
  font-size: 12px; font-weight: 700; margin-left: 6px; letter-spacing: 1px;
  font-family: 'Clash Display', sans-serif; color: var(--text-dim);
}
.wall-count-zero .wall-label { color: var(--color-red) !important; animation: pulse-urgent 0.5s ease-in-out infinite; }

.timer-area { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.timer-bar-bg { flex: 1; height: 3px; border-radius: 2px; background: var(--panel-border); overflow: hidden; }
.timer-bar-fill { height: 100%; border-radius: 2px; transition: width 0.25s linear, background 0.5s; width: 100%; }
.player-panel.p1 .timer-bar-fill { background: var(--p1); }
.player-panel.p2 .timer-bar-fill { background: var(--p2); }
.timer-bar-fill.urgent { background: var(--color-red) !important; animation: pulse-urgent 0.5s ease-in-out infinite; }
@keyframes pulse-urgent { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.timer-text {
  font-size: 0.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
  min-width: 22px; text-align: right; color: var(--text-dim);
  transition: color 0.3s; letter-spacing: 1px; font-family: 'Satoshi', sans-serif;
}
.timer-text.urgent { color: var(--color-red); }
.player-panel:not(.active) .timer-area { opacity: 0.3; }

/* --- Controls (segmented) --- */
.controls {
  display: flex; align-items: center; gap: 0; justify-content: center; width: 100%;
  background: var(--panel-bg); border-radius: var(--radius-xl); padding: 4px;
  border: 1px solid var(--panel-border);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.ctrl-btn {
  position: relative; flex: 1; padding: 8px 4px; border: none; border-radius: 20px;
  background: transparent; color: var(--text-dim);
  font-family: 'Satoshi', 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.7rem; font-weight: 600; cursor: pointer;
  transition: all var(--transition-snappy); letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  overflow: hidden;
}
.ctrl-btn svg { flex-shrink: 0; pointer-events: none; }
.ctrl-label { font-size: 0.65rem; letter-spacing: 1px; opacity: 0.6; pointer-events: none; }
.ctrl-btn:active { transform: scale(0.95); }
.ctrl-btn.active-move { background: var(--color-green); color: #fff; box-shadow: 0 2px 8px rgba(45,106,79,0.2); }
.ctrl-btn.active-wall { background: var(--text); color: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.ctrl-btn .kbd { display: none; }
.controls.inactive { opacity: 0.2; pointer-events: none; }

/* --- Board --- */
#board-container {
  position: relative; -webkit-user-select: none; user-select: none; touch-action: none;
  width: 100%; display: flex; justify-content: center; flex: 1; align-items: center; min-height: 0;
}
canvas#board {
  display: block; border-radius: var(--radius-md); cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  max-width: 100%; max-height: 100%; touch-action: none;
}

/* --- Center controls --- */
.center-controls { display: flex; gap: 8px; align-items: center; justify-content: center; flex-shrink: 0; }
#reset-btn, #undo-btn {
  padding: 6px 16px; border: 1px solid var(--panel-border); border-radius: var(--radius-sm);
  background: var(--panel-bg); color: var(--text-dim);
  font-family: 'Satoshi', sans-serif; font-size: 0.7rem; font-weight: 600;
  cursor: pointer; transition: all var(--transition-snappy);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 32px; letter-spacing: 2px; text-transform: uppercase;
  backdrop-filter: blur(8px);
}
#reset-btn:hover, #undo-btn:hover { border-color: var(--text-dim); transform: translateY(-1px); }
#reset-btn:active, #undo-btn:active { transform: scale(0.95); }
#undo-btn:disabled { opacity: 0.2; pointer-events: none; }

#message {
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.75rem;
  min-height: 16px; text-align: center; color: var(--text-dim);
  font-weight: 600; letter-spacing: 1px; flex-shrink: 0;
}

/* --- Winner overlay --- */
.winner-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0);
  display: flex; justify-content: center; align-items: center; z-index: 100;
  pointer-events: none; transition: background 0.8s; overflow: hidden;
}
.winner-overlay.show {
  background: rgba(11,11,13,0.5);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); pointer-events: auto;
}
.winner-box {
  background: var(--panel-bg); border-radius: var(--radius-2xl); padding: 48px 32px;
  text-align: center; border: 1px solid var(--panel-border);
  box-shadow: 0 24px 60px rgba(0,0,0,0.1);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transform: scale(0.9) translateY(20px); opacity: 0;
  transition: all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
  margin: 16px; max-width: 360px; width: 90%;
}
.winner-overlay.show .winner-box { transform: scale(1) translateY(0); opacity: 1; }
.winner-box .trophy {
  font-size: 56px; margin-bottom: 16px;
  animation: trophy-bounce 0.6s cubic-bezier(0.25,0.46,0.45,0.94) 0.3s both;
}
@keyframes trophy-bounce { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1) rotate(0deg); } }
.winner-box h2 {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 700;
  margin-bottom: 8px; letter-spacing: 6px; text-transform: uppercase;
}
.winner-box h2.win-p1 { color: var(--p1); }
.winner-box h2.win-p2 { color: var(--p2); }
.winner-box .win-label { font-size: clamp(0.8rem, 3vw, 1rem); font-weight: 600; margin-bottom: 16px; letter-spacing: 3px; font-family: 'Satoshi', sans-serif; }
.winner-box p { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 24px; letter-spacing: 1px; }
.winner-box button {
  width: 100%; padding: 14px 24px; border: none; border-radius: var(--radius-xl);
  background: var(--color-green); color: #fff;
  font-family: 'Satoshi', sans-serif; font-size: 0.85rem; font-weight: 600;
  cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; transition: all var(--transition-smooth);
}
.winner-box button:hover { background: var(--color-green-light); transform: translateY(-2px); }
.winner-box button:active { transform: scale(0.95); }
.confetti { position: absolute; width: 7px; height: 7px; border-radius: 2px; animation: confetti-fall linear forwards; pointer-events: none; }
@keyframes confetti-fall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

/* --- Start screen --- */
.start-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
  display: flex; justify-content: center; align-items: center; z-index: 200; flex-direction: column;
}
.start-box {
  text-align: center; padding: 20px;
  animation: fadeInUp 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
}
@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
.start-subtitle {
  font-size: clamp(0.65rem, 2vw, 0.8rem); color: var(--text-dim); letter-spacing: 4px;
  margin-bottom: 8px; font-weight: 400;
  font-family: 'Zen Kaku Gothic New', sans-serif; font-feature-settings: "palt" 1;
}
.start-box h2 {
  font-family: 'Clash Display', sans-serif;
  font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 600;
  letter-spacing: clamp(4px, 1.5vw, 12px);
  color: var(--text); margin-bottom: 4px; line-height: 1.1;
}
.start-box .tagline {
  color: var(--text-dim); font-size: 0.8rem; margin-bottom: 32px;
  letter-spacing: 4px; text-transform: uppercase; font-family: 'Satoshi', sans-serif;
}
.start-box button {
  width: 100%; max-width: 280px; padding: 14px 32px;
  border: 1px solid var(--panel-border); border-radius: var(--radius-xl);
  background: var(--panel-bg); color: var(--text);
  font-family: 'Satoshi', 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; letter-spacing: 2px;
  text-transform: uppercase; transition: all var(--transition-smooth);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; position: relative; overflow: hidden;
  backdrop-filter: blur(8px);
}
.start-box button:hover { border-color: var(--p1); transform: translateY(-2px); }
.start-box button:active { transform: scale(0.97); }
.hidden { display: none; }

.name-inputs {
  display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; width: 100%; max-width: 280px; margin-left: auto; margin-right: auto;
}
.name-input {
  flex: 1; padding: 10px 12px; border: 1px solid var(--panel-border);
  border-radius: var(--radius-md); background: var(--panel-bg);
  color: var(--text); font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.85rem; font-weight: 500; outline: none; text-align: center;
  transition: border-color var(--transition-smooth);
  backdrop-filter: blur(8px);
}
.name-input:focus { border-color: var(--p1); }
.name-input::placeholder { color: var(--text-dim); opacity: 0.5; }

/* Online mode */
#room-code-input {
  text-align: center; font-size: 1.5rem; letter-spacing: 8px; width: 160px; padding: 12px 16px;
  border-radius: var(--radius-md); border: 1px solid var(--panel-border);
  background: var(--panel-bg); color: var(--text);
  font-family: 'Clash Display', monospace; font-weight: 500; outline: none;
  backdrop-filter: blur(8px); transition: border-color var(--transition-smooth);
}
#room-code-input:focus { border-color: var(--p1); box-shadow: 0 0 0 3px rgba(45,106,79,0.08); }
.start-box .back-btn {
  padding: 8px 16px !important; font-size: 0.75rem !important; min-height: 32px !important;
  letter-spacing: 1px !important; opacity: 0.5;
}
.disconnect-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--color-red); color: #fff; text-align: center;
  padding: 8px 16px; font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.75rem; font-weight: 600; z-index: 9999; letter-spacing: 1px;
}
canvas#board.guest-flip { transform: rotate(180deg); }
</style>
</head>
<body>

<div id="disconnect-banner" class="disconnect-banner" style="display:none">接続が切れました…再接続中</div>

<div class="start-overlay" id="start-overlay">
  <div class="start-box">
    <div class="start-subtitle">戦略ボードゲーム</div>
    <h2>QUORIDOR</h2>
    <p class="tagline">2 PLAYER DUEL</p>
    <div class="name-inputs">
      <input type="text" class="name-input" id="name-p1" placeholder="Player 1" maxlength="10">
      <input type="text" class="name-input" id="name-p2" placeholder="Player 2" maxlength="10">
    </div>
    <div id="mode-select" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <button onclick="startGame()">ローカル対戦</button>
      <button onclick="showOnlineMenu()">オンライン対戦</button>
      <button onclick="startAIGame()">AI対戦</button>
    </div>
    <div id="online-menu" style="display:none">
      <button onclick="createRoom()">部屋をつくる</button>
      <button onclick="showJoinInput()">部屋に入る</button>
      <div style="margin-top:10px"><button class="back-btn" onclick="backToModeSelect()">← もどる</button></div>
    </div>
    <div id="join-input" style="display:none">
      <input type="text" id="room-code-input" maxlength="4" placeholder="4桁のコード" inputmode="numeric" pattern="[0-9]*">
      <div style="margin-top:8px">
        <button onclick="joinRoom()">参加</button>
      </div>
      <div style="margin-top:4px"><button class="back-btn" onclick="showOnlineMenu()">← もどる</button></div>
    </div>
    <div id="waiting-room" style="display:none">
      <p style="font-size:14px;letter-spacing:2px;color:var(--text-dim)">ルームコード</p>
      <p id="display-room-code" style="font-size:32px;font-weight:900;letter-spacing:8px;margin:8px 0;color:var(--text);font-family:'Clash Display',sans-serif"></p>
      <p style="font-size:11px;color:var(--text-dim);letter-spacing:1px">相手の参加を待っています...</p>
      <div style="margin-top:12px"><button onclick="cancelRoom()">キャンセル</button></div>
    </div>
    <div id="online-error" style="display:none">
      <p id="online-error-msg" style="color:#ff4444;font-size:12px;margin-bottom:8px"></p>
    </div>
  </div>
</div>

<div id="app">
  <div class="player-zone p2-zone">
    <div class="controls inactive" id="controls-p2">
      <button class="ctrl-btn active-move" id="btn-move-p2" onclick="setMode('move')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="ctrl-label">MOVE</span></button>
      <button class="ctrl-btn" id="btn-wall-h-p2" onclick="setMode('wall-h')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><circle cx="6" cy="7" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="6" cy="17" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="18" cy="7" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="18" cy="17" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/></svg><span class="ctrl-label">WALL</span></button>
      <button class="ctrl-btn" id="btn-wall-v-p2" onclick="setMode('wall-v')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"/><circle cx="7" cy="6" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="17" cy="6" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="7" cy="18" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/><circle cx="17" cy="18" r="1.5" fill="currentColor" stroke="none" opacity="0.25"/></svg><span class="ctrl-label">WALL</span></button>
    </div>
    <div class="player-panel p2" id="p2-panel">
      <div class="panel-row">
        <div class="player-icon p2">II</div>
        <span class="player-name" id="p2-name">P2</span>
        <span class="turn-badge">TURN</span>
        <div class="wall-indicators" id="p2-walls"></div>

// ============ COORDINATE HELPERS ============
function cellX(col) { return PAD + col * (CELL + GAP); }
function cellY(row) { return PAD + row * (CELL + GAP); }
function pixelToCell(px, py) { for (var r = 0; r < GRID; r++) for (var c = 0; c < GRID; c++) { var x = cellX(c), y = cellY(r); if (px >= x && px < x + CELL && py >= y && py < y + CELL) return { row: r, col: c }; } return null; }
function pixelToWallSlot(px, py) { var dist = Math.max(CELL * 0.55, 24); for (var r = 0; r < GRID - 1; r++) for (var c = 0; c < GRID - 1; c++) { var cx = cellX(c) + CELL + GAP / 2; var cy = cellY(r) + CELL + GAP / 2; if (Math.abs(px - cx) < dist && Math.abs(py - cy) < dist) return { row: r, col: c }; } return null; }
function autoDetectOrientation(px, py, slot) {
  var intCx = cellX(slot.col) + CELL + GAP / 2;
  var intCy = cellY(slot.row) + CELL + GAP / 2;
  return Math.abs(px - intCx) >= Math.abs(py - intCy) ? 'h' : 'v';
}

// ============ WALL LOGIC ============
function isBlocked(r1, c1, r2, c2) {
  var dr = r2 - r1, dc = c2 - c1;
  for (var i = 0; i < walls.length; i++) { var w = walls[i];
    if (dr === -1 && dc === 0 && w.orient === 'h' && w.row === r1 - 1 && (w.col === c1 || w.col === c1 - 1)) return true;
    if (dr === 1  && dc === 0 && w.orient === 'h' && w.row === r1     && (w.col === c1 || w.col === c1 - 1)) return true;
    if (dc === -1 && dr === 0 && w.orient === 'v' && w.col === c1 - 1 && (w.row === r1 || w.row === r1 - 1)) return true;
    if (dc === 1  && dr === 0 && w.orient === 'v' && w.col === c1     && (w.row === r1 || w.row === r1 - 1)) return true;
  } return false;
}

  var goalRow = p === 0 ? 0 : 8;

  var visited = []; for (var i = 0; i < GRID; i++) { visited[i] = []; for (var j = 0; j < GRID; j++) visited[i][j] = false; }
  var queue = [{ row: players[p].row, col: players[p].col }];
  visited[players[p].row][players[p].col] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  while (queue.length) {
    var cur = queue.shift(); if (cur.row === goalRow) return true;
    for (var d = 0; d < 4; d++) { var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];

      for (var k = 0; k < allWalls.length; k++) { var w = allWalls[k];

        if (dr === 1  && dc === 0 && w.orient === 'h' && w.row === cur.row     && (w.col === cur.col || w.col === cur.col - 1)) { blocked = true; break; }
        if (dc === -1 && dr === 0 && w.orient === 'v' && w.col === cur.col - 1 && (w.row === cur.row || w.row === cur.row - 1)) { blocked = true; break; }
        if (dc === 1  && dr === 0 && w.orient === 'v' && w.col === cur.col     && (w.row === cur.row || w.row === cur.row - 1)) { blocked = true; break; }

function getValidMoves(p) {

  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (var d = 0; d < 4; d++) { var dr = dirs[d][0], dc = dirs[d][1], nr = row + dr, nc = col + dc;
    if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue; if (isBlocked(row, col, nr, nc)) continue;
    if (opp.row === nr && opp.col === nc) { var jr = nr + dr, jc = nc + dc;

function draw() {

    ctx.strokeStyle = T.cellStroke; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.roundRect(x, y, CELL, CELL, cr); ctx.stroke();
  }

    ctx.fillStyle = T.p1 + '12'; ctx.beginPath(); ctx.roundRect(cellX(gc), cellY(0), CELL, CELL, cr); ctx.fill();
    ctx.fillStyle = T.p2 + '12'; ctx.beginPath(); ctx.roundRect(cellX(gc), cellY(8), CELL, CELL, cr); ctx.fill();

  }

  for (var wi = 0; wi < walls.length; wi++) drawWall(walls[wi].row, walls[wi].col, walls[wi].orient);
  if (hoverWall && !gameOver) drawWallPreview(hoverWall.row, hoverWall.col, hoverWall.orient, canPlaceWall(hoverWall.row, hoverWall.col, hoverWall.orient));
  drawPlayer(players[0], 0); drawPlayer(players[1], 1);
}

function drawWall(r, c, orient) {
  ctx.save(); var wr = Math.max(2, GAP * 0.3); var wc = T.wallColor;
  var wallFill = 'rgba('+wc[0]+','+wc[1]+','+wc[2]+',0.75)';
  if (orient === 'h') {
    var x = cellX(c), y = cellY(r) + CELL, w = CELL * 2 + GAP, h = GAP;
    ctx.fillStyle = wallFill; ctx.beginPath(); ctx.roundRect(x, y, w, h, wr); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.roundRect(x + w*0.1, y + 1, w*0.8, 1, 1); ctx.fill();
  } else {
    var vx = cellX(c) + CELL, vy = cellY(r), vw = GAP, vh = CELL * 2 + GAP;
    ctx.fillStyle = wallFill; ctx.beginPath(); ctx.roundRect(vx, vy, vw, vh, wr); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.roundRect(vx + 1, vy + vh*0.1, 1, vh*0.8, 1); ctx.fill();
  }
  ctx.restore();
}

function drawWallPreview(r, c, orient, valid) {
  ctx.save(); ctx.globalAlpha = 0.5;
  var color = valid ? T.moveColor + '0.6)' : 'rgba(255,0,0,0.6)';
  ctx.fillStyle = color;
  var wr = Math.max(2, GAP * 0.3);
  if (orient === 'h') { ctx.beginPath(); ctx.roundRect(cellX(c), cellY(r) + CELL, CELL * 2 + GAP, GAP, wr); ctx.fill(); }
  else { ctx.beginPath(); ctx.roundRect(cellX(c) + CELL, cellY(r), GAP, CELL * 2 + GAP, wr); ctx.fill(); }
  ctx.restore();
}

function drawPlayer(p, idx) {
  var cx = cellX(p.col) + CELL / 2, cy = cellY(p.row) + CELL / 2;
  var isActive = currentPlayer === idx && !gameOver;
  var pr = CELL * 0.34;
  var color = idx === 0 ? T.p1 : T.p2;
  ctx.save();
  // Subtle active shadow
  if (isActive) { ctx.shadowColor = color; ctx.shadowBlur = 8; }
  // Flat circle
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // Small specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(cx - pr * 0.2, cy - pr * 0.25, pr * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function backToModeSelect() {
  document.getElementById('mode-select').style.display = '';

  document.getElementById('waiting-room').style.display = 'none';

function showOnlineError(msg) {
  document.getElementById('online-error').style.display = '';

function createRoom() {
  if (!myUid) { showOnlineError('認証中…少し待ってください'); return; }
  var code = String(Math.floor(1000 + Math.random() * 9000));
  db.ref('rooms/' + code).once('value').then(function(snap) {
    if (snap.exists()) {
      // Collision, try again
      createRoom();
      return;
    }
    roomCode = code;
    db.ref('rooms/' + code).set({
      host: myUid,
      guest: null,
      state: null,
      status: 'waiting',
      createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(function() {
      // Auto-remove room on disconnect
      db.ref('rooms/' + code).onDisconnect().remove();
      document.getElementById('online-menu').style.display = 'none';
      document.getElementById('waiting-room').style.display = '';
      document.getElementById('display-room-code').textContent = code;
      // Listen for guest joining
      presenceListener = db.ref('rooms/' + code + '/guest').on('value', function(gSnap) {
        if (gSnap.val()) {
          db.ref('rooms/' + code + '/guest').off('value', presenceListener);
          presenceListener = null;
          startOnlineGame(0);
        }
      });
    }).catch(function(err) {
      showOnlineError('部屋の作成に失敗: ' + err.message);
    });
  });
}

function joinRoom() {
  if (!myUid) { showOnlineError('認証中…少し待ってください'); return; }
  var code = document.getElementById('room-code-input').value.trim();
  if (code.length !== 4 || !/^\d{4}$/.test(code)) {
    showOnlineError('4桁の数字を入力してください');
    return;
  }
  db.ref('rooms/' + code).once('value').then(function(snap) {
    if (!snap.exists()) {
      showOnlineError('この部屋は存在しません');
      return;
    }
    var room = snap.val();
    if (room.status !== 'waiting') {
      showOnlineError('この部屋は既にゲーム中です');
      return;
    }
    roomCode = code;
    db.ref('rooms/' + code).update({
      guest: myUid,
      status: 'playing'
    }).then(function() {
      startOnlineGame(1);
    }).catch(function(err) {
      showOnlineError('参加に失敗: ' + err.message);
    });
  });
}

function cancelRoom() {
  if (presenceListener) {
    db.ref('rooms/' + roomCode + '/guest').off('value', presenceListener);
    presenceListener = null;
  }
  if (roomCode) {
    db.ref('rooms/' + roomCode).onDisconnect().cancel();
    db.ref('rooms/' + roomCode).remove();
    roomCode = '';
  }
  showOnlineMenu();
}

function leaveRoom() {
  if (stateListener) {
    if (roomRef) roomRef.child('state').off('value', stateListener);
    stateListener = null;
  }
  if (presenceListener) {
    if (roomCode) db.ref('rooms/' + roomCode + '/guest').off('value', presenceListener);
    presenceListener = null;
  }
  if (roomRef) {
    roomRef.onDisconnect().cancel();
    roomRef.child('status').set('ended');
    roomRef = null;
  }
  document.getElementById('disconnect-banner').style.display = 'none';
  gameMode = 'local';
  myPlayerIndex = -1;
  roomCode = '';
}

// ============ ONLINE GAME START & SYNC ============
function startOnlineGame(playerIndex) {
  gameMode = 'online';
  myPlayerIndex = playerIndex;
  roomRef = db.ref('rooms/' + roomCode);
  var n1 = document.getElementById('name-p1').value.trim() || 'Player 1';
  document.getElementById('start-overlay').classList.add('hidden');
  initAudio(); initState(); gameStarted = true;
  document.getElementById('p1-name').textContent = n1;
  document.getElementById('p2-name').textContent = 'Online';
  // Guest sees the board flipped
  if (myPlayerIndex === 1) {
    canvas.classList.add('guest-flip');
  } else {
    canvas.classList.remove('guest-flip');
  }
  resizeBoard(); showMsg(''); updateUI(); draw();
  // Host writes initial state, then both listen
  if (myPlayerIndex === 0) {
    syncStateToFirebase();
    // Cancel auto-remove since game started
    roomRef.onDisconnect().cancel();
  }
  startStateListener();
  startTurnTimer();
  monitorConnection();
  monitorOpponent();
}

function syncStateToFirebase() {
  if (gameMode !== 'online' || !roomRef) return;
  roomRef.child('state').set({
    players: players,
    walls: walls,
    wallCounts: wallCounts,
    currentPlayer: currentPlayer,
    gameOver: gameOver,
    winner: gameOver ? (players[0].row === 0 ? 0 : 1) : -1,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });
}

function startStateListener() {
  stateListener = roomRef.child('state').on('value', function(snap) {
    var s = snap.val();
    if (!s) return;
    // Apply remote state when it's my turn (opponent just played) or game over
    if (s.currentPlayer === myPlayerIndex || s.gameOver) {
      applyRemoteState(s);
    }
  });
}

function applyRemoteState(s) {
  players = s.players;
  walls = s.walls || [];
  wallCounts = s.wallCounts;
  var prevPlayer = currentPlayer;
  currentPlayer = s.currentPlayer;
  mode = 'move'; hoverWall = null;
  undoSnapshot = null; // 相手が動いたのでUNDOできない
  updateUI(); draw();
  if (s.gameOver && s.winner >= 0) {
    gameOver = true;
    showWinner(s.winner);
  } else if (prevPlayer !== currentPlayer) {
    clearInterval(timerInterval);
    startTurnTimer();
  }
}

function monitorConnection() {
  var connRef = db.ref('.info/connected');
  connRef.on('value', function(snap) {
    if (gameMode !== 'online') return;
    var banner = document.getElementById('disconnect-banner');
    if (snap.val() === true) {
      banner.style.display = 'none';
    } else {
      banner.style.display = '';
    }
  });
}

function monitorOpponent() {
  if (!roomRef) return;
  roomRef.child('status').on('value', function(snap) {
    var status = snap.val();
    if (status === 'ended' && gameMode === 'online' && !gameOver) {
      showMsg('相手が退出しました');
      gameOver = true;
      clearInterval(timerInterval);
    }
  });
}

// ============ REMATCH ============
var rematchListener = null;

function requestRematch() {
  if (!roomRef) return;
  roomRef.child('rematch/' + myPlayerIndex).set(true);
  document.getElementById('rematch-status').textContent = '相手の応答を待っています...';
  // Listen for opponent's rematch flag
  var opponentIdx = 1 - myPlayerIndex;
  if (rematchListener) { roomRef.child('rematch').off('value', rematchListener); }
  rematchListener = roomRef.child('rematch').on('value', function(snap) {
    var rm = snap.val();
    if (rm && rm[0] === true && rm[1] === true) {
      roomRef.child('rematch').off('value', rematchListener);
      rematchListener = null;
      startRematch();

function startRematch() {

  roomRef.child('rematch').remove();
  // Close winner overlay

  var confetti = overlay.querySelectorAll('.confetti'); for (var i = 0; i < confetti.length; i++) confetti[i].remove();
  // Reset game state
  clearInterval(timerInterval);
  initState(); gameStarted = true; gameOver = false;
  mode = 'move'; hoverWall = null;
  showMsg(''); updateUI(); draw();
  // Host syncs the fresh state
  if (myPlayerIndex === 0) {
    syncStateToFirebase();
  }

function exitOnlineGame() {
  // Close winner overlay
  var overlay = document.getElementById('winner-overlay'); overlay.classList.remove('show');
  var confetti = overlay.querySelectorAll('.confetti'); for (var i = 0; i < confetti.length; i++) confetti[i].remove();

  if (rematchListener && roomRef) { roomRef.child('rematch').off('value', rematchListener); rematchListener = null; }
  // Leave room
  leaveRoom();
  clearInterval(timerInterval);
  if (audioCtx) { audioCtx.close().catch(function(){}); audioCtx = null; }

  document.getElementById('start-overlay').classList.remove('hidden');

function undo() {
  if (!undoSnapshot || gameOver || !gameStarted) return;
  if (aiMode && aiThinking) return; // Can't undo while AI is thinking
  var whoMoved = undoSnapshot.currentPlayer;
  if (gameMode === 'online' && whoMoved !== myPlayerIndex) { showMsg('相手の手は戻せません'); return; }
  if (aiMode && whoMoved === aiPlayer) { showMsg('AIの手は戻せません'); return; }
  players = undoSnapshot.players;

  currentPlayer = undoSnapshot.currentPlayer;

// BFS shortest path for a given player with a given wall list
function aiShortestPath(pRow, pCol, goalRow, wallList) {
  var visited = [];
  for (var i = 0; i < GRID; i++) { visited[i] = []; for (var j = 0; j < GRID; j++) visited[i][j] = false; }
  var queue = [{ row: pRow, col: pCol, dist: 0 }];
  visited[pRow][pCol] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  while (queue.length) {
    var cur = queue.shift();
    if (cur.row === goalRow) return cur.dist;
    for (var d = 0; d < 4; d++) {
      var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
      if (visited[nr][nc]) continue;
      var dr = nr - cur.row, dc = nc - cur.col, blocked = false;
      for (var k = 0; k < wallList.length; k++) {
        var w = wallList[k];
        if (dr===-1&&dc===0&&w.orient==='h'&&w.row===cur.row-1&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dr===1&&dc===0&&w.orient==='h'&&w.row===cur.row&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dc===-1&&dr===0&&w.orient==='v'&&w.col===cur.col-1&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
        if (dc===1&&dr===0&&w.orient==='v'&&w.col===cur.col&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
      }
      if (blocked) continue;
      visited[nr][nc] = true;
      queue.push({ row: nr, col: nc, dist: cur.dist + 1 });
    }
  }
  return 999;
}

// BFS path (returns array of cells from start to goal)
function bfsPath(pIdx, wallList) {
  var goalRow = pIdx === 0 ? 0 : 8;
  var start = players[pIdx];
  var visited = [];
  var prev = [];
  for (var i = 0; i < GRID; i++) { visited[i] = []; prev[i] = []; for (var j = 0; j < GRID; j++) { visited[i][j] = false; prev[i][j] = null; } }
  var queue = [{ row: start.row, col: start.col }];
  visited[start.row][start.col] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var found = null;
  while (queue.length) {
    var cur = queue.shift();
    if (cur.row === goalRow) { found = cur; break; }
    for (var d = 0; d < 4; d++) {
      var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
      if (visited[nr][nc]) continue;
      var dr = nr - cur.row, dc = nc - cur.col, blocked = false;
      for (var k = 0; k < wallList.length; k++) {
        var w = wallList[k];
        if (dr===-1&&dc===0&&w.orient==='h'&&w.row===cur.row-1&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dr===1&&dc===0&&w.orient==='h'&&w.row===cur.row&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dc===-1&&dr===0&&w.orient==='v'&&w.col===cur.col-1&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
        if (dc===1&&dr===0&&w.orient==='v'&&w.col===cur.col&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
      }
      if (blocked) continue;
      visited[nr][nc] = true;
      prev[nr][nc] = { row: cur.row, col: cur.col };
      queue.push({ row: nr, col: nc });
    }
  }
  if (!found) return [];
  var path = [];
  var c = found;
  while (c) { path.unshift({ row: c.row, col: c.col }); c = prev[c.row][c.col]; }
  return path;
}

// Get smart wall candidates - walls near opponent's shortest path
function getSmartWallCandidates() {
  var humanIdx = 1 - aiPlayer;
  var path = bfsPath(humanIdx, walls);
  var candidates = [];
  var seen = {};
  for (var i = 0; i < path.length - 1; i++) {
    var r1 = path[i].row, c1 = path[i].col;
    var r2 = path[i+1].row, c2 = path[i+1].col;
    var dr = r2 - r1, dc = c2 - c1;
    // moving vertically (up or down) -> horizontal wall blocks
    if (dc === 0) {
      var wr = dr === 1 ? r1 : r2; // wall row: between the two cells
      for (var wc = Math.max(0, c1 - 1); wc <= Math.min(GRID - 2, c1); wc++) {
        var key = wr + ',' + wc + ',h';
        if (!seen[key]) { seen[key] = true; candidates.push({ row: wr, col: wc, orient: 'h' }); }
      }
    }
    // moving horizontally (left or right) -> vertical wall blocks
    if (dr === 0) {
      var wc2 = dc === 1 ? c1 : c2;
      for (var wr2 = Math.max(0, r1 - 1); wr2 <= Math.min(GRID - 2, r1); wr2++) {
        var key2 = wr2 + ',' + wc2 + ',v';
        if (!seen[key2]) { seen[key2] = true; candidates.push({ row: wr2, col: wc2, orient: 'v' }); }
      }
    }
  }
  // Also add walls near AI's path for defensive play
  var aiPath = bfsPath(aiPlayer, walls);
  for (var j = 0; j < aiPath.length - 1; j++) {
    var ar1 = aiPath[j].row, ac1 = aiPath[j].col;
    var ar2 = aiPath[j+1].row, ac2 = aiPath[j+1].col;
    // Add nearby intersections
    for (var or2 = Math.max(0, Math.min(ar1,ar2) - 1); or2 <= Math.min(GRID - 2, Math.max(ar1,ar2)); or2++) {
      for (var oc2 = Math.max(0, Math.min(ac1,ac2) - 1); oc2 <= Math.min(GRID - 2, Math.max(ac1,ac2)); oc2++) {
        var keyH = or2 + ',' + oc2 + ',h';
        var keyV = or2 + ',' + oc2 + ',v';
        if (!seen[keyH]) { seen[keyH] = true; candidates.push({ row: or2, col: oc2, orient: 'h' }); }
        if (!seen[keyV]) { seen[keyV] = true; candidates.push({ row: or2, col: oc2, orient: 'v' }); }
      }
    }
  }
  return candidates;
}

// AI evaluation function
function aiEvaluate(wallList, wCounts, plyrs) {
  var aiGoal = aiPlayer === 0 ? 0 : 8;
  var humanGoal = aiPlayer === 0 ? 8 : 0;
  var humanIdx = 1 - aiPlayer;
  var aiDist = aiShortestPath(plyrs[aiPlayer].row, plyrs[aiPlayer].col, aiGoal, wallList);
  var humanDist = aiShortestPath(plyrs[humanIdx].row, plyrs[humanIdx].col, humanGoal, wallList);
  return (humanDist - aiDist) + (wCounts[aiPlayer] - wCounts[humanIdx]) * 0.3;
}

// Minimax with alpha-beta pruning (depth 2)
function aiMinimax(depth, isMaximizing, alpha, beta, wallList, wCounts, plyrs) {
  var aiGoal = aiPlayer === 0 ? 0 : 8;
  var humanGoal = aiPlayer === 0 ? 8 : 0;
  var humanIdx = 1 - aiPlayer;
  // Terminal check
  if (plyrs[aiPlayer].row === aiGoal) return 9999;
  if (plyrs[humanIdx].row === humanGoal) return -9999;
  if (depth === 0) return aiEvaluate(wallList, wCounts, plyrs);

  var currentIdx = isMaximizing ? aiPlayer : humanIdx;
  var oppIdx = 1 - currentIdx;
  var bestScore = isMaximizing ? -Infinity : Infinity;

  // Move candidates
  var row = plyrs[currentIdx].row, col = plyrs[currentIdx].col;
  var opp = plyrs[oppIdx];
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var moves = [];
  for (var d = 0; d < 4; d++) {
    var dr = dirs[d][0], dc = dirs[d][1], nr = row + dr, nc = col + dc;
    if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
    // Check wall blocking
    var bk = false;
    for (var k = 0; k < wallList.length; k++) {
      var w = wallList[k];
      if (dr===-1&&dc===0&&w.orient==='h'&&w.row===row-1&&(w.col===col||w.col===col-1)){bk=true;break;}
      if (dr===1&&dc===0&&w.orient==='h'&&w.row===row&&(w.col===col||w.col===col-1)){bk=true;break;}
      if (dc===-1&&dr===0&&w.orient==='v'&&w.col===col-1&&(w.row===row||w.row===row-1)){bk=true;break;}
      if (dc===1&&dr===0&&w.orient==='v'&&w.col===col&&(w.row===row||w.row===row-1)){bk=true;break;}
    }
    if (bk) continue;
    if (opp.row === nr && opp.col === nc) {
      var jr = nr + dr, jc = nc + dc;
      if (jr >= 0 && jr < GRID && jc >= 0 && jc < GRID) {
        var jbk = false;
        for (var k2 = 0; k2 < wallList.length; k2++) {
          var w2 = wallList[k2]; var jdr = jr-nr, jdc = jc-nc;
          if (jdr===-1&&jdc===0&&w2.orient==='h'&&w2.row===nr-1&&(w2.col===nc||w2.col===nc-1)){jbk=true;break;}
          if (jdr===1&&jdc===0&&w2.orient==='h'&&w2.row===nr&&(w2.col===nc||w2.col===nc-1)){jbk=true;break;}
          if (jdc===-1&&jdr===0&&w2.orient==='v'&&w2.col===nc-1&&(w2.row===nr||w2.row===nr-1)){jbk=true;break;}
          if (jdc===1&&jdr===0&&w2.orient==='v'&&w2.col===nc&&(w2.row===nr||w2.row===nr-1)){jbk=true;break;}
        }
        if (!jbk) moves.push({ row: jr, col: jc });
        else {
          for (var d2 = 0; d2 < 4; d2++) {
            if (dirs[d2][0]===-dr && dirs[d2][1]===-dc) continue;
            var djr=nr+dirs[d2][0],djc=nc+dirs[d2][1];
            if (djr<0||djr>=GRID||djc<0||djc>=GRID) continue;
            var djbk=false;
            for (var k3=0;k3<wallList.length;k3++){var w3=wallList[k3];var ddr=djr-nr,ddc=djc-nc;
              if(ddr===-1&&ddc===0&&w3.orient==='h'&&w3.row===nr-1&&(w3.col===nc||w3.col===nc-1)){djbk=true;break;}
              if(ddr===1&&ddc===0&&w3.orient==='h'&&w3.row===nr&&(w3.col===nc||w3.col===nc-1)){djbk=true;break;}
              if(ddc===-1&&ddr===0&&w3.orient==='v'&&w3.col===nc-1&&(w3.row===nr||w3.row===nr-1)){djbk=true;break;}
              if(ddc===1&&ddr===0&&w3.orient==='v'&&w3.col===nc&&(w3.row===nr||w3.row===nr-1)){djbk=true;break;}
            }
            if (!djbk) moves.push({ row: djr, col: djc });
          }
        }
      } else {
        for (var d3 = 0; d3 < 4; d3++) {
          if (dirs[d3][0]===-dr && dirs[d3][1]===-dc) continue;
          var djr2=nr+dirs[d3][0],djc2=nc+dirs[d3][1];
          if (djr2<0||djr2>=GRID||djc2<0||djc2>=GRID) continue;
          var djbk2=false;
          for (var k4=0;k4<wallList.length;k4++){var w4=wallList[k4];var ddr2=djr2-nr,ddc2=djc2-nc;
            if(ddr2===-1&&ddc2===0&&w4.orient==='h'&&w4.row===nr-1&&(w4.col===nc||w4.col===nc-1)){djbk2=true;break;}
            if(ddr2===1&&ddc2===0&&w4.orient==='h'&&w4.row===nr&&(w4.col===nc||w4.col===nc-1)){djbk2=true;break;}
            if(ddc2===-1&&ddr2===0&&w4.orient==='v'&&w4.col===nc-1&&(w4.row===nr||w4.row===nr-1)){djbk2=true;break;}
            if(ddc2===1&&ddr2===0&&w4.orient==='v'&&w4.col===nc&&(w4.row===nr||w4.row===nr-1)){djbk2=true;break;}
          }
          if (!djbk2) moves.push({ row: djr2, col: djc2 });
        }
      }
    } else { moves.push({ row: nr, col: nc }); }
  }

  // Evaluate moves
  for (var mi = 0; mi < moves.length; mi++) {
    var savedRow = plyrs[currentIdx].row, savedCol = plyrs[currentIdx].col;
    plyrs[currentIdx] = { row: moves[mi].row, col: moves[mi].col };
    var score = aiMinimax(depth - 1, !isMaximizing, alpha, beta, wallList, wCounts, plyrs);
    plyrs[currentIdx] = { row: savedRow, col: savedCol };
    if (isMaximizing) {
      if (score > bestScore) bestScore = score;
      if (bestScore > alpha) alpha = bestScore;
    } else {
      if (score < bestScore) bestScore = score;
      if (bestScore < beta) beta = bestScore;
    }
    if (beta <= alpha) break;
  }

  return bestScore;
}

// AI main turn function
function aiTurn() {
  if (!aiMode || currentPlayer !== aiPlayer || gameOver) return;
  aiThinking = true;
  showMsg('AI思考中...');

  setTimeout(function() {
    var bestScore = -Infinity;
    var bestAction = null;
    var aiGoal = aiPlayer === 0 ? 0 : 8;

    // 1. Evaluate move candidates with minimax depth 2
    var moves = getValidMoves(aiPlayer);
    for (var i = 0; i < moves.length; i++) {
      var savedPos = { row: players[aiPlayer].row, col: players[aiPlayer].col };
      var plyrs = [{ row: players[0].row, col: players[0].col }, { row: players[1].row, col: players[1].col }];
      plyrs[aiPlayer] = { row: moves[i].row, col: moves[i].col };
      // Instant win
      if (moves[i].row === aiGoal) {
        bestScore = 99999;
        bestAction = { type: 'move', row: moves[i].row, col: moves[i].col };
        break;
      }
      var score = aiMinimax(1, false, -Infinity, Infinity, walls, wallCounts, plyrs);
      if (score > bestScore) {
        bestScore = score;
        bestAction = { type: 'move', row: moves[i].row, col: moves[i].col };
      }
    }

    // 2. Evaluate wall candidates (only if walls remaining and no instant win)
    if (wallCounts[aiPlayer] > 0 && bestScore < 99999) {
      var wallCands = getSmartWallCandidates();
      for (var j = 0; j < wallCands.length; j++) {
        var wc = wallCands[j];
        if (!canPlaceWall(wc.row, wc.col, wc.orient)) continue;
        // Simulate wall placement
        walls.push(wc);
        var wCounts = [wallCounts[0], wallCounts[1]];
        wCounts[aiPlayer]--;
        var plyrs2 = [{ row: players[0].row, col: players[0].col }, { row: players[1].row, col: players[1].col }];
        var wScore = aiMinimax(1, false, -Infinity, Infinity, walls, wCounts, plyrs2);
        walls.pop();
        if (wScore > bestScore) {
          bestScore = wScore;
          bestAction = { type: 'wall', row: wc.row, col: wc.col, orient: wc.orient };
        }
      }
    }

    // 3. Execute best action
    aiThinking = false;
    executeAIAction(bestAction);
  }, 300);
}

function executeAIAction(action) {
  if (!action) return;
  saveSnapshot();
  if (action.type === 'move') {
    players[aiPlayer].row = action.row;
    players[aiPlayer].col = action.col;
    playMoveSFX(); showMsg('');
    var aiGoal = aiPlayer === 0 ? 0 : 8;
    if (players[aiPlayer].row === aiGoal) {
      gameOver = true; draw(); updateUI(); showWinner(aiPlayer); return;
    }
  } else {
    walls.push({ row: action.row, col: action.col, orient: action.orient });
    wallCounts[aiPlayer]--;
    playWallSFX(); showMsg(''); mode = 'move'; hoverWall = null;
  }
  currentPlayer = 1 - currentPlayer;
  updateUI(); draw(); startTurnTimer();
}

// ============ TOUCH & POINTER ============
function getCanvasPos(e) {
  var rect = canvas.getBoundingClientRect(), scaleX = BOARD_PX / rect.width, scaleY = BOARD_PX / rect.height;
  var clientX, clientY;
  if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  var px = (clientX - rect.left) * scaleX, py = (clientY - rect.top) * scaleY;
  // Guest side: invert coords because canvas is CSS-rotated 180deg
  if (gameMode === 'online' && myPlayerIndex === 1) {
    px = BOARD_PX - px; py = BOARD_PX - py;
  }
  return { px: px, py: py };
}

function handleBoardAction(px, py) {
  if (gameOver || !gameStarted) return; ensureAudioResumed();
  if (gameMode === 'online' && currentPlayer !== myPlayerIndex) { showMsg('相手のターンです'); return; }
  if (aiMode && (currentPlayer === aiPlayer || aiThinking)) { showMsg('AIのターンです'); return; }
  if (mode === 'move') {
    var cell = pixelToCell(px, py); if (!cell) return;
    var moves = getValidMoves(currentPlayer);
    var match = null; for (var i = 0; i < moves.length; i++) { if (moves[i].row === cell.row && moves[i].col === cell.col) { match = moves[i]; break; } }
    if (!match) { showMsg('INVALID MOVE'); return; }
    saveSnapshot();
    players[currentPlayer].row = match.row; players[currentPlayer].col = match.col; playMoveSFX(); showMsg('');
    if (currentPlayer === 0 && players[0].row === 0) { gameOver = true; draw(); updateUI(); if (gameMode === 'online') syncStateToFirebase(); showWinner(0); return; }
    if (currentPlayer === 1 && players[1].row === 8) { gameOver = true; draw(); updateUI(); if (gameMode === 'online') syncStateToFirebase(); showWinner(1); return; }
    currentPlayer = 1 - currentPlayer; updateUI(); draw(); startTurnTimer();
    if (gameMode === 'online') syncStateToFirebase();
    if (aiMode && currentPlayer === aiPlayer) { setTimeout(function() { aiTurn(); }, 100); }
  } else {
    var slot = pixelToWallSlot(px, py); if (!slot) { showMsg('交差点の近くをタップ'); return; }
    if (wallCounts[currentPlayer] <= 0) { showMsg('NO WALLS LEFT'); return; }
    // Use pre-selected orientation
    var autoOrient = orientation;
    if (!canPlaceWall(slot.row, slot.col, autoOrient)) {
      showMsg('CANNOT PLACE'); return;
    }
    saveSnapshot();
    walls.push({ row: slot.row, col: slot.col, orient: autoOrient }); wallCounts[currentPlayer]--;
    playWallSFX(); showMsg(''); mode = 'move'; hoverWall = null;
    currentPlayer = 1 - currentPlayer; updateUI(); draw(); startTurnTimer();
    if (gameMode === 'online') syncStateToFirebase();
    if (aiMode && currentPlayer === aiPlayer) { setTimeout(function() { aiTurn(); }, 100); }
  }
}

canvas.addEventListener('click', function(e) { var pos = getCanvasPos(e); handleBoardAction(pos.px, pos.py); });
canvas.addEventListener('mousemove', function(e) { if (gameOver || mode !== 'wall') { if (hoverWall) { hoverWall = null; draw(); } return; } var pos = getCanvasPos(e); var slot = pixelToWallSlot(pos.px, pos.py); if (slot) { hoverWall = { row: slot.row, col: slot.col, orient: orientation }; } else { hoverWall = null; } draw(); });
canvas.addEventListener('mouseleave', function() { hoverWall = null; draw(); });

var touchStartPos = null;
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); touchStartPos = getCanvasPos(e); }, { passive: false });
canvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (mode === 'wall' && !gameOver) { var pos = getCanvasPos(e); var slot = pixelToWallSlot(pos.px, pos.py); if (slot) { hoverWall = { row: slot.row, col: slot.col, orient: orientation }; } else { hoverWall = null; } draw(); } }, { passive: false });
canvas.addEventListener('touchend', function(e) { e.preventDefault(); if (!touchStartPos) return; var endPos = getCanvasPos(e); var dx = endPos.px - touchStartPos.px; var dy = endPos.py - touchStartPos.py; if (Math.abs(dx) < CELL * 1.5 && Math.abs(dy) < CELL * 1.5) { handleBoardAction(endPos.px, endPos.py); } hoverWall = null; touchStartPos = null; draw(); }, { passive: false });
canvas.addEventListener('touchcancel', function() { hoverWall = null; touchStartPos = null; draw(); });
document.addEventListener('touchmove', function(e) { if (e.target === canvas || canvas.contains(e.target)) e.preventDefault(); }, { passive: false });

document.addEventListener('keydown', function(e) { if (!gameStarted) return; if (e.key === 'm' || e.key === 'M') setMode('move'); if (e.key === 'h' || e.key === 'H') setMode('wall-h'); if (e.key === 'v' || e.key === 'V') setMode('wall-v'); if (e.key === 'r' || e.key === 'R') resetGame(); if (e.key === 'u' || e.key === 'U') undo(); });
(function() {
  var modes = [
    { suffix: 'move', mode: 'move' },
    { suffix: 'wall-h', mode: 'wall-h' },
    { suffix: 'wall-v', mode: 'wall-v' }
  ];
  ['p1', 'p2'].forEach(function(p) {
    modes.forEach(function(m) {
      var el = document.getElementById('btn-' + m.suffix + '-' + p);
      if (el) {
        el.addEventListener('touchstart', function(e) {
          e.preventDefault();
          setMode(m.mode);
        }, { passive: false });
      }
    });
  });
})();

var resizeTimer;
window.addEventListener('resize', function() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function() { if (gameStarted) resizeBoard(); }, 150); });
window.addEventListener('orientationchange', function() { setTimeout(function() { if (gameStarted) resizeBoard(); }, 300); });

// ============ INIT ============
// Force-clear overlays on page load (prevents stale PWA state)
(function() {
  var wo = document.getElementById('winner-overlay');
  wo.classList.remove('show');
  wo.removeAttribute('style');
  var wb = wo.querySelector('.winner-box');
  if (wb) wb.removeAttribute('style');
  var cf = wo.querySelectorAll('.confetti');
  for (var i = 0; i < cf.length; i++) cf[i].remove();
})();
initState(); resizeBoard(); updateUI(); draw();

// ============ CACHE CLEANUP & SERVICE WORKER ============
// Force-clean old caches (v1-v8) so stale cache-first SWs can't block updates
(function() {
  var CURRENT = 'quoridor-v34';
  if ('caches' in window) {
    caches.keys().then(function(keys) {
      var old = keys.filter(function(k) { return k !== CURRENT; });
      if (old.length > 0) {
        Promise.all(old.map(function(k) { return caches.delete(k); })).then(function() {
          // If we cleaned old caches, force SW update and reload
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) reg.update();
            });
          }
        });
      }
    });
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=34').then(function(reg) {
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'activated') location.reload();
          });
        }
      });
    }).catch(function() {});
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      location.reload();
    });
  }
})();
