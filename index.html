<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コリドール">
<meta name="theme-color" content="#f0e6d3">
<meta name="description" content="2人で遊べる戦略ボードゲーム コリドール">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<title>コリドール</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap');

:root {
  --color-ink: #2c1810; --color-ink-muted: #8b7355;
  --color-cream: #f0e6d3; --color-sand: #e8d5b8;
  --color-green: #6b7c3f; --color-green-light: #8a9f5a;
  --color-red: #c13b2a; --color-red-light: #d4564a;
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px;
  --radius-xl: 8px; --radius-2xl: 12px;
  --transition-smooth: 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  --transition-snappy: 0.15s cubic-bezier(0.17,0.67,0.83,0.67);
  --bg: #f0e6d3; --text: #2c1810; --text-dim: #8b7355;
  --panel-bg: rgba(244,232,210,0.92); --panel-border: rgba(44,24,16,0.15);
  --p1: #c87533; --p1-light: #d4935a; --p2: #2b4a8f; --p2-light: #4a6bb5;
  --board-bg: #e8dcc8; --board-border: rgba(44,24,16,0.2);
  --wall-color: #2c1810; --move-color: #6b7c3f; --title-color: #2c1810;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Playfair Display', 'Zen Kaku Gothic New', serif;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  overflow: hidden;
}

/* Canvas linen texture */
body::before {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='linen' width='4' height='4' patternUnits='userSpaceOnUse'%3E%3Cpath d='M0 0h1v1H0zM2 2h1v1H2z' fill='%23000' fill-opacity='0.04'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='40' height='40' fill='url(%23linen)'/%3E%3C/svg%3E");
  background-repeat: repeat; background-size: 40px 40px;
  opacity: 0.5; pointer-events: none; z-index: 9998; mix-blend-mode: multiply;
}

/* Background abstract shapes (Picasso) */
#bg-blobs { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; filter: blur(100px); will-change: transform; }
.blob-1 { width: 50vmax; height: 50vmax; top: -15%; left: -5%; background: radial-gradient(circle, #c9917a 0%, transparent 70%); opacity: 0.15; clip-path: polygon(30% 0%, 70% 10%, 100% 60%, 60% 100%, 0% 70%); animation: blob-drift-1 50s ease-in-out infinite; }
.blob-2 { width: 45vmax; height: 45vmax; bottom: -10%; right: -10%; background: radial-gradient(circle, #6b7c3f 0%, transparent 70%); opacity: 0.1; clip-path: polygon(20% 0%, 100% 20%, 80% 100%, 0% 80%); animation: blob-drift-2 60s ease-in-out infinite; }
.blob-3 { width: 35vmax; height: 35vmax; top: 35%; left: 45%; background: radial-gradient(circle, #2b4a8f 0%, transparent 70%); opacity: 0.08; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); animation: blob-drift-3 70s ease-in-out infinite; }
@keyframes blob-drift-1 { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(15vw,10vh) scale(1.1)} 50%{transform:translate(-5vw,25vh) scale(0.9)} 75%{transform:translate(10vw,-5vh) scale(1.05)} }
@keyframes blob-drift-2 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(-20vw,-15vh) scale(1.15)} 66%{transform:translate(10vw,-20vh) scale(0.85)} }
@keyframes blob-drift-3 { 0%,100%{transform:translate(0,0) scale(1) rotate(0deg)} 50%{transform:translate(-30vw,10vh) scale(1.2) rotate(180deg)} }

#app {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  padding: calc(8px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));
  width: 100%; max-width: 600px; height: 100vh; height: 100dvh;
  overflow: visible; position: relative; z-index: 1;
}

.player-zone { width: 100%; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.player-zone.p2-zone { transform: rotate(180deg); }

/* --- Player Panels --- */
.player-panel {
  width: 100%; padding: 10px 14px; border-radius: 0;
  background: var(--panel-bg); border: 1px solid var(--panel-border);
  border-left: 4px solid transparent;
  transition: all var(--transition-smooth); position: relative; overflow: hidden;
  transform: rotate(-0.3deg);
}
.player-panel.p1 { border-left-color: var(--p1); }
.player-panel.p2 { border-left-color: var(--p2); }
.player-panel.active.p1 { border-left-width: 6px; box-shadow: 3px 3px 15px rgba(200,117,51,0.15), inset 0 0 20px rgba(200,117,51,0.05); }
.player-panel.active.p2 { border-left-width: 6px; box-shadow: 3px 3px 15px rgba(43,74,143,0.15), inset 0 0 20px rgba(43,74,143,0.05); }

.panel-row { display: flex; align-items: center; gap: 8px; }
.player-icon {
  width: 28px; height: 28px; border-radius: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fffef0; flex-shrink: 0; border: 1.5px solid #2c1810;
  font-family: 'Playfair Display', serif;
}
.player-icon.p1 { background: var(--p1); }
.player-icon.p2 { background: var(--p2); }
.player-name {
  font-size: clamp(0.7rem, 2vw, 0.85rem); font-weight: 700; color: var(--text);
  white-space: nowrap; letter-spacing: 4px; text-transform: uppercase;
  font-family: 'Playfair Display', serif;
}
.turn-badge {
  display: inline-block; font-size: 0.55rem; font-weight: 700; padding: 2px 8px;
  border-radius: 0; margin-left: 4px; opacity: 0;
  transition: opacity var(--transition-snappy); letter-spacing: 2px; flex-shrink: 0;
  font-family: 'Playfair Display', serif; border: 1px solid currentColor;
}
.player-panel.active .turn-badge { opacity: 1; }
.player-panel.p1 .turn-badge { background: transparent; color: var(--p1); }
.player-panel.p2 .turn-badge { background: transparent; color: var(--p2); }

.wall-indicators { display: flex; align-items: center; margin-left: auto; }
.wall-pip { display: none; }
.wall-label {
  font-size: 24px; font-weight: 700; letter-spacing: 0;
  font-family: 'Playfair Display', serif; color: var(--text); line-height: 1;
}
.wall-count-zero .wall-label { color: var(--color-red) !important; animation: pulse-urgent 0.5s ease-in-out infinite; text-shadow: 0 0 8px rgba(193,59,42,0.4); }

.timer-area { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.timer-bar-bg { display: none; }
.timer-bar-fill { display: none; }
.timer-text {
  font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums;
  text-align: left; color: rgba(255,255,255,0.2);
  transition: color 0.3s, text-shadow 0.3s; letter-spacing: 2px;
  font-family: 'Playfair Display', serif; line-height: 1;
}
.player-panel.active .timer-text { color: var(--text); }
.timer-text.urgent { color: var(--color-red) !important; text-shadow: 0 0 15px rgba(193,59,42,0.4); }
@keyframes pulse-urgent { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.player-panel:not(.active) .timer-area { opacity: 0.15; }

/* --- Controls (wire-frame) --- */
.controls {
  display: flex; align-items: center; gap: 2px; justify-content: center; width: 100%;
  background: transparent; border-radius: 0; padding: 2px;
  border: 1px solid var(--panel-border);
}
.ctrl-btn {
  position: relative; flex: 1; padding: 8px 4px; border: none; border-radius: 20px;
  background: transparent; color: var(--text-dim);
  font-family: 'Playfair Display', 'Zen Kaku Gothic New', serif;
  font-size: 0.7rem; font-weight: 600; cursor: pointer;
  transition: all var(--transition-snappy); letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  overflow: hidden;
}
.ctrl-btn svg { flex-shrink: 0; pointer-events: none; }
.ctrl-label { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.4; pointer-events: none; }
.ctrl-btn:active { transform: scale(0.97); }
.ctrl-btn.active-move { background: var(--p1); color: #fffef0; border-color: var(--p1); box-shadow: 2px 2px 8px rgba(200,117,51,0.2); transform: scale(1.02); }
.ctrl-btn.active-wall { background: #2c1810; color: #fffef0; border-color: #2c1810; box-shadow: 2px 2px 8px rgba(44,24,16,0.2); transform: scale(1.02); }
.ctrl-btn .kbd { display: none; }
.controls.inactive { opacity: 0.15; pointer-events: none; }

/* --- Board --- */
#board-container {
  position: relative; -webkit-user-select: none; user-select: none; touch-action: none;
  width: 100%; display: flex; justify-content: center; flex: 1; align-items: center; min-height: 0;
}
canvas#board {
  display: block; border-radius: 0; cursor: pointer;
  box-shadow: 4px 4px 20px rgba(44,24,16,0.25), -2px -2px 10px rgba(44,24,16,0.1);
  max-width: 100%; max-height: 100%; touch-action: none;
}

/* --- Center controls --- */
.center-controls { display: flex; gap: 8px; align-items: center; justify-content: center; flex-shrink: 0; }
#reset-btn, #undo-btn {
  padding: 6px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 0;
  background: transparent; color: var(--text-dim);
  font-family: 'Playfair Display', serif; font-size: 0.65rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 32px; letter-spacing: 3px; text-transform: uppercase;
}
#reset-btn:hover, #undo-btn:hover { border-color: var(--text); color: var(--text); box-shadow: 2px 2px 6px rgba(44,24,16,0.1); }
#reset-btn:active, #undo-btn:active { transform: scale(0.95); }
#undo-btn:disabled { opacity: 0.15; pointer-events: none; }

#message {
  font-family: 'Playfair Display', serif; font-size: 0.7rem;
  min-height: 16px; text-align: center; color: var(--text-dim);
  font-weight: 600; letter-spacing: 2px; flex-shrink: 0; font-style: italic;
}

/* --- Winner overlay --- */
.winner-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0);
  display: flex; justify-content: center; align-items: center; z-index: 100;
  pointer-events: none; transition: background 0.3s; overflow: hidden;
}
.winner-overlay.show {
  background: rgba(240,230,211,0.9); pointer-events: auto;
  animation: screen-shake 0.4s ease-out;
}
@keyframes screen-shake { 0%{transform:translate(0,0)} 10%{transform:translate(-8px,4px)} 20%{transform:translate(6px,-6px)} 30%{transform:translate(-4px,2px)} 40%{transform:translate(2px,-2px)} 50%,100%{transform:translate(0,0)} }
.winner-box {
  background: transparent; border-radius: 0; padding: 48px 32px;
  text-align: center; border: none;
  transform: scale(4); opacity: 0;
  transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
  margin: 16px; max-width: 400px; width: 90%;
}
.winner-overlay.show .winner-box { transform: scale(1); opacity: 1; }
.winner-box .trophy { display: none; }
.winner-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 10vw, 5rem); font-weight: 700;
  margin-bottom: 8px; letter-spacing: 8px; text-transform: uppercase;
}
.winner-box h2.win-p1 { color: var(--p1); text-shadow: 3px 3px 0 rgba(200,117,51,0.3), 0 0 30px rgba(200,117,51,0.2); }
.winner-box h2.win-p2 { color: var(--p2); text-shadow: 3px 3px 0 rgba(43,74,143,0.3), 0 0 30px rgba(43,74,143,0.2); }
.winner-box .win-label { font-size: clamp(0.8rem, 3vw, 1rem); font-weight: 700; margin-bottom: 16px; letter-spacing: 4px; font-family: 'Playfair Display', serif; }
.winner-box p { color: var(--text-dim); font-size: 0.8rem; font-style: italic; margin-bottom: 24px; letter-spacing: 2px; font-family: 'Playfair Display', serif; }
.winner-box button {
  width: 100%; padding: 14px 24px; border: 1px solid rgba(255,255,255,0.15); border-radius: 0;
  background: transparent; color: #fff;
  font-family: 'Playfair Display', serif; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; letter-spacing: 3px; text-transform: uppercase;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; transition: all 0.2s;
}
.winner-box button:hover { background: var(--p1); color: #fffef0; border-color: var(--p1); }
.winner-box button:active { transform: scale(0.95); }

/* --- Start screen --- */
.start-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(240,230,211,0.97);
  display: flex; justify-content: center; align-items: center; z-index: 200; flex-direction: column;
}
.start-box {
  text-align: center; padding: 20px;
  animation: fadeInUp 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
}
@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
.start-subtitle {
  font-size: clamp(0.6rem, 2vw, 0.75rem); color: #666; letter-spacing: 6px;
  margin-bottom: 8px; font-weight: 400;
  font-family: 'Zen Kaku Gothic New', sans-serif; font-feature-settings: "palt" 1;
}
.start-box h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 700;
  letter-spacing: clamp(8px, 2vw, 20px);
  color: #2c1810; margin-bottom: 4px; line-height: 1.1;
  text-shadow: 3px 3px 0 rgba(200,117,51,0.3), -1px -1px 0 rgba(43,74,143,0.15);
}
.title-anim span { display: inline-block; animation: letter-in 0.6s cubic-bezier(0.25,0.46,0.45,0.94) both; }
@keyframes letter-in { 0%{opacity:0; transform:translateY(25px) rotate(-8deg) skewX(-5deg)} 100%{opacity:1; transform:translateY(0) rotate(0deg) skewX(0deg)} }
.start-box .tagline {
  color: #666; font-size: 0.7rem; margin-bottom: 32px;
  letter-spacing: 6px; text-transform: uppercase; font-family: 'Playfair Display', serif;
}
.start-box button {
  width: 100%; max-width: 280px; padding: 14px 32px;
  border: 1px solid rgba(255,255,255,0.15); border-radius: 0;
  background: transparent; color: var(--text);
  font-family: 'Playfair Display', 'Zen Kaku Gothic New', serif;
  font-size: 0.75rem; font-weight: 700; cursor: pointer; letter-spacing: 3px;
  text-transform: uppercase; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  min-height: 48px; position: relative; overflow: hidden;
}
.start-box button:hover { border-color: var(--p1); color: var(--p1); box-shadow: 3px 3px 12px rgba(200,117,51,0.15); transform: translateY(-1px); }
.start-box button:active { transform: scale(0.97); }
.hidden { display: none; }

.name-inputs {
  display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; width: 100%; max-width: 280px; margin-left: auto; margin-right: auto;
}
.name-input {
  flex: 1; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 0; background: rgba(17,17,17,0.8);
  color: var(--text); font-family: 'Playfair Display', serif;
  font-size: 0.8rem; font-weight: 500; outline: none; text-align: center;
  transition: border-color 0.2s;
}
.name-input:focus { border-color: var(--p1); box-shadow: 0 0 8px rgba(200,117,51,0.15); }
.name-input::placeholder { color: #b8a88c; }

/* Online mode */
#room-code-input {
  text-align: center; font-size: 1.5rem; letter-spacing: 8px; width: 160px; padding: 12px 16px;
  border-radius: 0; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(17,17,17,0.8); color: var(--text);
  font-family: 'Playfair Display', serif; font-weight: 700; outline: none;
}
#room-code-input:focus { border-color: var(--p1); box-shadow: 0 0 10px rgba(200,117,51,0.15); }
.start-box .back-btn {
  padding: 8px 16px !important; font-size: 0.7rem !important; min-height: 32px !important;
  letter-spacing: 2px !important; opacity: 0.5;
}
.disconnect-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: #c13b2a; color: #fffef0; text-align: center;
  padding: 8px 16px; font-family: 'Playfair Display', serif;
  font-size: 0.7rem; font-weight: 700; z-index: 9999; letter-spacing: 2px;
}
canvas#board.guest-flip { transform: rotate(180deg); }

/* --- v36 micro-interactions --- */
@keyframes badge-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.75; }
}
.player-panel.active .turn-badge { animation: badge-pulse 1.2s ease-in-out infinite; }

@keyframes bounce-count {
  0% { transform: scale(1.4); }
  50% { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.wall-label.updated { animation: bounce-count 0.35s cubic-bezier(0.34,1.56,0.64,1); }

@keyframes micro-shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-3px); }
  40% { transform: translateX(3px); }
  60% { transform: translateX(-2px); }
  80% { transform: translateX(1px); }
}
canvas#board.shake-invalid { animation: micro-shake 0.25s ease-out; }

.ctrl-btn::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  border-radius: inherit; transform: scale(0); opacity: 0;
  transition: transform 0.3s, opacity 0.3s;
}
.ctrl-btn:active::after { transform: scale(2.5); opacity: 1; transition: transform 0s, opacity 0s; }

#bg-blobs.p1-active .blob-1 { opacity: 0.2; transition: opacity 0.6s; }
#bg-blobs.p1-active .blob-2 { opacity: 0.06; transition: opacity 0.6s; }
#bg-blobs.p2-active .blob-2 { opacity: 0.18; transition: opacity 0.6s; }
#bg-blobs.p2-active .blob-1 { opacity: 0.06; transition: opacity 0.6s; }
</style>
</head>
<body>

<div id="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="disconnect-banner" class="disconnect-banner" style="display:none">接続が切れました…再接続中</div>

<div class="start-overlay" id="start-overlay">
  <div class="start-box">
    <div class="start-subtitle">戦略ボードゲーム</div>
    <h2 class="title-anim"><span style="animation-delay:0s">Q</span><span style="animation-delay:0.08s">U</span><span style="animation-delay:0.16s">O</span><span style="animation-delay:0.24s">R</span><span style="animation-delay:0.32s">I</span><span style="animation-delay:0.4s">D</span><span style="animation-delay:0.48s">O</span><span style="animation-delay:0.56s">R</span></h2>
    <p class="tagline">2 PLAYER DUEL</p>
    <div class="name-inputs">
      <input type="text" class="name-input" id="name-p1" placeholder="Player 1" maxlength="10">
      <input type="text" class="name-input" id="name-p2" placeholder="Player 2" maxlength="10">
    </div>
    <div id="mode-select" style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <button onclick="startGame()">ローカル対戦</button>
      <button onclick="showOnlineMenu()">オンライン対戦</button>
      <button onclick="startAIGame()">AI対戦</button>
    </div>
    <div id="online-menu" style="display:none">
      <button onclick="createRoom()">部屋をつくる</button>
      <button onclick="showJoinInput()">部屋に入る</button>
      <div style="margin-top:10px"><button class="back-btn" onclick="backToModeSelect()">← もどる</button></div>
    </div>
    <div id="join-input" style="display:none">
      <input type="text" id="room-code-input" maxlength="4" placeholder="4桁のコード" inputmode="numeric" pattern="[0-9]*">
      <div style="margin-top:8px">
        <button onclick="joinRoom()">参加</button>
      </div>
      <div style="margin-top:4px"><button class="back-btn" onclick="showOnlineMenu()">← もどる</button></div>
    </div>

function spawnParticle(x, y, vx, vy, life, color, size, gravity) {
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({ x: x, y: y, vx: vx, vy: vy, life: life, maxLife: life, color: color, size: size || 3, gravity: gravity || 0 });

function updateParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var alpha = p.life / p.maxLife;
    var s = p.size * (0.5 + alpha * 0.5);

    ctx.fillStyle = p.color;
    ctx.strokeStyle = '#2c1810'; ctx.lineWidth = 0.5;

    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 0.1);

    if (st === 0) { ctx.moveTo(0,-s); ctx.lineTo(s*0.87,s*0.5); ctx.lineTo(-s*0.87,s*0.5); ctx.closePath(); }
    else if (st === 1) { ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); }

// ============ COORDINATE HELPERS ============
function cellX(col) { return PAD + col * (CELL + GAP); }
function cellY(row) { return PAD + row * (CELL + GAP); }
function pixelToCell(px, py) { for (var r = 0; r < GRID; r++) for (var c = 0; c < GRID; c++) { var x = cellX(c), y = cellY(r); if (px >= x && px < x + CELL && py >= y && py < y + CELL) return { row: r, col: c }; } return null; }
function pixelToWallSlot(px, py) { var dist = Math.max(CELL * 0.55, 24); for (var r = 0; r < GRID - 1; r++) for (var c = 0; c < GRID - 1; c++) { var cx = cellX(c) + CELL + GAP / 2; var cy = cellY(r) + CELL + GAP / 2; if (Math.abs(px - cx) < dist && Math.abs(py - cy) < dist) return { row: r, col: c }; } return null; }
function autoDetectOrientation(px, py, slot) {
  var intCx = cellX(slot.col) + CELL + GAP / 2;
  var intCy = cellY(slot.row) + CELL + GAP / 2;
  return Math.abs(px - intCx) >= Math.abs(py - intCy) ? 'h' : 'v';
}

// ============ WALL LOGIC ============
function isBlocked(r1, c1, r2, c2) {
  var dr = r2 - r1, dc = c2 - c1;
  for (var i = 0; i < walls.length; i++) { var w = walls[i];
    if (dr === -1 && dc === 0 && w.orient === 'h' && w.row === r1 - 1 && (w.col === c1 || w.col === c1 - 1)) return true;
    if (dr === 1  && dc === 0 && w.orient === 'h' && w.row === r1     && (w.col === c1 || w.col === c1 - 1)) return true;
    if (dc === -1 && dr === 0 && w.orient === 'v' && w.col === c1 - 1 && (w.row === r1 || w.row === r1 - 1)) return true;
    if (dc === 1  && dr === 0 && w.orient === 'v' && w.col === c1     && (w.row === r1 || w.row === r1 - 1)) return true;
  } return false;
}
function wallOverlaps(r, c, o) { for (var i = 0; i < walls.length; i++) { var w = walls[i]; if (w.orient === o && o === 'h' && w.row === r && Math.abs(w.col - c) <= 1) return true; if (w.orient === o && o === 'v' && w.col === c && Math.abs(w.row - r) <= 1) return true; if (w.row === r && w.col === c && w.orient !== o) return true; } return false; }
function canReachGoal(p, extraWalls) {
  var goalRow = p === 0 ? 0 : 8;
  var allWalls = walls.concat(extraWalls || []);
  var visited = []; for (var i = 0; i < GRID; i++) { visited[i] = []; for (var j = 0; j < GRID; j++) visited[i][j] = false; }
  var queue = [{ row: players[p].row, col: players[p].col }];
  visited[players[p].row][players[p].col] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  while (queue.length) {
    var cur = queue.shift(); if (cur.row === goalRow) return true;
    for (var d = 0; d < 4; d++) { var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue; if (visited[nr][nc]) continue;
      var dr = nr - cur.row, dc = nc - cur.col, blocked = false;
      for (var k = 0; k < allWalls.length; k++) { var w = allWalls[k];
        if (dr === -1 && dc === 0 && w.orient === 'h' && w.row === cur.row - 1 && (w.col === cur.col || w.col === cur.col - 1)) { blocked = true; break; }
        if (dr === 1  && dc === 0 && w.orient === 'h' && w.row === cur.row     && (w.col === cur.col || w.col === cur.col - 1)) { blocked = true; break; }
        if (dc === -1 && dr === 0 && w.orient === 'v' && w.col === cur.col - 1 && (w.row === cur.row || w.row === cur.row - 1)) { blocked = true; break; }
        if (dc === 1  && dr === 0 && w.orient === 'v' && w.col === cur.col     && (w.row === cur.row || w.row === cur.row - 1)) { blocked = true; break; }
      } if (blocked) continue; visited[nr][nc] = true; queue.push({ row: nr, col: nc });
    }
  } return false;
}
function canPlaceWall(r, c, o) { if (r < 0 || r >= GRID - 1 || c < 0 || c >= GRID - 1) return false; if (wallOverlaps(r, c, o)) return false; var tw = { row: r, col: c, orient: o }; return canReachGoal(0, [tw]) && canReachGoal(1, [tw]); }

// ============ MOVEMENT LOGIC ============
function getValidMoves(p) {
  var row = players[p].row, col = players[p].col, opp = players[1 - p], moves = [];
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (var d = 0; d < 4; d++) { var dr = dirs[d][0], dc = dirs[d][1], nr = row + dr, nc = col + dc;
    if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue; if (isBlocked(row, col, nr, nc)) continue;
    if (opp.row === nr && opp.col === nc) { var jr = nr + dr, jc = nc + dc;
      if (jr >= 0 && jr < GRID && jc >= 0 && jc < GRID && !isBlocked(nr, nc, jr, jc)) { moves.push({ row: jr, col: jc }); }
      else { for (var d2 = 0; d2 < 4; d2++) { if (dirs[d2][0] === -dr && dirs[d2][1] === -dc) continue; var djr = nr + dirs[d2][0], djc = nc + dirs[d2][1]; if (djr < 0 || djr >= GRID || djc < 0 || djc >= GRID) continue; if (isBlocked(nr, nc, djr, djc)) continue; moves.push({ row: djr, col: djc }); } }
    } else { moves.push({ row: nr, col: nc }); }
  } return moves;
}

// ============ DRAWING ============
function draw() {
  ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);
  updateParticles();
  // Warm canvas background
  ctx.fillStyle = T.boardBg;
  ctx.fillRect(0, 0, BOARD_PX, BOARD_PX);
  // Painted frame border (wobbly lines)
  ctx.save();
  ctx.strokeStyle = 'rgba(44,24,16,0.3)'; ctx.lineWidth = 3;
  for (var edge = 0; edge < 4; edge++) {
    ctx.beginPath();
    for (var ep = 0; ep <= 8; ep++) {
      var t = ep / 8; var wb = (seededRandom(boardSeed + edge * 100 + ep) - 0.5) * 2;
      var ex, ey;
      if (edge === 0) { ex = t * BOARD_PX; ey = 1.5 + wb; }
      else if (edge === 1) { ex = BOARD_PX - 1.5 + wb; ey = t * BOARD_PX; }
      else if (edge === 2) { ex = (1 - t) * BOARD_PX; ey = BOARD_PX - 1.5 + wb; }
      else { ex = 1.5 + wb; ey = (1 - t) * BOARD_PX; }
      if (ep === 0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
    }
    ctx.stroke();
  }
  ctx.restore();

  // Cubist grid cells with perspective distortion
  for (var r = 0; r < GRID; r++) for (var c = 0; c < GRID; c++) {
    var x = cellX(c), y = cellY(r);
    var seed = boardSeed + r * GRID + c;
    var skX = (seededRandom(seed) - 0.5) * 1.5;
    var skY = (seededRandom(seed + 50) - 0.5) * 1.5;
    var hShift = seededRandom(seed + 200) * 15;
    var lit = 85 + seededRandom(seed + 300) * 5;
    ctx.fillStyle = 'hsl(' + (35 + hShift) + ',25%,' + lit + '%)';
    ctx.beginPath();
    ctx.moveTo(x + skX, y + skY);
    ctx.lineTo(x + CELL + skX * 0.5, y - skY * 0.5);
    ctx.lineTo(x + CELL - skX, y + CELL - skY);
    ctx.lineTo(x - skX * 0.5, y + CELL + skY * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = T.cellStroke;
    ctx.lineWidth = 0.6 + seededRandom(seed + 400) * 1.2;
    ctx.stroke();
  }

  // Goal rows (warm ochre / cool blue wash)
  var goalPulse = 0.08 + Math.sin(pulsePhase * 0.03) * 0.04;
  for (var gc = 0; gc < GRID; gc++) {
    ctx.fillStyle = 'rgba(200,117,51,' + goalPulse + ')';
    ctx.fillRect(cellX(gc), cellY(0), CELL, CELL);
    ctx.fillStyle = 'rgba(43,74,143,' + goalPulse + ')';
    ctx.fillRect(cellX(gc), cellY(8), CELL, CELL);
  }

  // Valid moves (olive diamond markers)
  if (!gameOver && mode === 'move') {
    var moves = getValidMoves(currentPlayer);
    for (var mi = 0; mi < moves.length; mi++) {
      var mcx = cellX(moves[mi].col), mcy = cellY(moves[mi].row);
      ctx.fillStyle = T.moveColor + '0.1)';
      ctx.fillRect(mcx, mcy, CELL, CELL);
      var dmx = mcx + CELL / 2, dmy = mcy + CELL / 2;
      var ds = Math.max(5, CELL * 0.12);
      ctx.save(); ctx.translate(dmx, dmy); ctx.rotate(Math.PI / 4);
      ctx.fillStyle = T.validDot;
      ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
      ctx.strokeStyle = 'rgba(44,24,16,0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(-ds / 2, -ds / 2, ds, ds);
      ctx.restore();
    }
  }

  // Intersection cross marks (wall mode)
  if (!gameOver && mode === 'wall') {
    ctx.save();
    ctx.strokeStyle = 'rgba(44,24,16,0.25)'; ctx.lineWidth = 1.5;
    for (var ir = 0; ir < GRID - 1; ir++) for (var ic = 0; ic < GRID - 1; ic++) {
      var ix = cellX(ic) + CELL + GAP / 2, iy = cellY(ir) + CELL + GAP / 2;
      var gs = Math.max(3, GAP * 0.4);
      ctx.beginPath();
      ctx.moveTo(ix - gs, iy); ctx.lineTo(ix + gs, iy);
      ctx.moveTo(ix, iy - gs); ctx.lineTo(ix, iy + gs);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (var wi = 0; wi < walls.length; wi++) drawWall(walls[wi].row, walls[wi].col, walls[wi].orient);
  if (hoverWall && !gameOver) drawWallPreview(hoverWall.row, hoverWall.col, hoverWall.orient, canPlaceWall(hoverWall.row, hoverWall.col, hoverWall.orient));

  // Hover cell glow (desktop)
  if (hoverCell && !gameOver && mode === 'move') {
    var hx = cellX(hoverCell.col), hy = cellY(hoverCell.row);
    ctx.save();
    ctx.shadowColor = currentPlayer === 0 ? T.p1 : T.p2;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = currentPlayer === 0 ? T.p1 : T.p2;
    ctx.lineWidth = 2.5;
    var hPulse = 1 + Math.sin(pulsePhase * 0.1) * 0.08;
    var hOff = (CELL * (1 - hPulse)) / 2;
    ctx.strokeRect(hx + hOff, hy + hOff, CELL * hPulse, CELL * hPulse);
    ctx.restore();
  }

  // Canvas weave texture overlay
  ctx.save(); ctx.globalAlpha = 0.03; ctx.strokeStyle = '#2c1810'; ctx.lineWidth = 0.5;
  for (var tx = 0; tx < BOARD_PX; tx += 8) { ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, BOARD_PX); ctx.stroke(); }
  for (var ty = 0; ty < BOARD_PX; ty += 8) { ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(BOARD_PX, ty); ctx.stroke(); }
  ctx.restore();

  drawParticles();
  drawPlayer(players[0], 0); drawPlayer(players[1], 1);
}

function drawWall(r, c, orient) {
  ctx.save();
  var wc = T.wallColor;
  var seed = boardSeed + r * 100 + c * 10 + (orient === 'h' ? 0 : 5000);
  var thickVar = 1 + (seededRandom(seed + 200) - 0.5) * 0.5;
  var rotVar = (seededRandom(seed + 300) - 0.5) * 0.015;
  var x, y, w, h;
  if (orient === 'h') {
    x = cellX(c); y = cellY(r) + CELL; w = CELL * 2 + GAP; h = GAP * thickVar;
  } else {
    x = cellX(c) + CELL; y = cellY(r); w = GAP * thickVar; h = CELL * 2 + GAP;
  }
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rotVar);
  // Rough-edged brush stroke
  ctx.fillStyle = 'rgb(' + wc[0] + ',' + wc[1] + ',' + wc[2] + ')';
  ctx.beginPath();
  var steps = 6;
  for (var i = 0; i <= steps; i++) { var t = i / steps; ctx.lineTo(-w/2 + t*w, -h/2 + (seededRandom(seed+i*10)-0.5)*h*0.3); }
  for (var i = steps; i >= 0; i--) { var t = i / steps; ctx.lineTo(-w/2 + t*w, h/2 + (seededRandom(seed+100+i*10)-0.5)*h*0.3); }
  ctx.closePath(); ctx.fill();
  // Warm highlight
  ctx.globalAlpha = 0.15; ctx.fillStyle = '#5a3a28';
  if (orient === 'h') ctx.fillRect(-w*0.4, -h*0.15, w*0.8, h*0.3);
  else ctx.fillRect(-w*0.15, -h*0.4, w*0.3, h*0.8);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawWallPreview(r, c, orient, valid) {
  ctx.save();
  var pulse = 0.3 + Math.sin(pulsePhase * 0.12) * 0.15;
  ctx.globalAlpha = pulse;
  if (valid) {
    ctx.strokeStyle = 'rgb(' + T.wallColor[0] + ',' + T.wallColor[1] + ',' + T.wallColor[2] + ')';
    ctx.fillStyle = 'rgba(' + T.wallColor[0] + ',' + T.wallColor[1] + ',' + T.wallColor[2] + ',0.4)';
  } else {
    ctx.strokeStyle = 'rgba(193,59,42,0.8)'; ctx.fillStyle = 'rgba(193,59,42,0.3)';
  }
  ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
  if (orient === 'h') {
    ctx.fillRect(cellX(c), cellY(r) + CELL, CELL * 2 + GAP, GAP);
    ctx.strokeRect(cellX(c), cellY(r) + CELL, CELL * 2 + GAP, GAP);
  } else {
    ctx.fillRect(cellX(c) + CELL, cellY(r), GAP, CELL * 2 + GAP);
    ctx.strokeRect(cellX(c) + CELL, cellY(r), GAP, CELL * 2 + GAP);
  }
  ctx.setLineDash([]); ctx.restore();
}

function drawPlayer(p, idx) {
  var cx = cellX(p.col) + CELL / 2, cy = cellY(p.row) + CELL / 2;
  var isActive = currentPlayer === idx && !gameOver;
  var r = CELL * 0.38;
  var color = idx === 0 ? T.p1 : T.p2;
  var colorLight = idx === 0 ? T.p1Light : T.p2Light;
  ctx.save();
  var scale = 1;
  if (isActive) scale = 1 + Math.sin(pulsePhase * 0.05) * 0.03;
  ctx.translate(cx, cy); ctx.scale(scale, scale);
  if (idx === 0) drawCubistFaceWarm(r, isActive, color, colorLight);
  else drawCubistFaceCool(r, isActive, color, colorLight);
  // Active ring (dashed sketch)
  if (isActive) {
    var rr = CELL * 0.5 + Math.sin(pulsePhase * 0.07) * 3;
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.2 + Math.sin(pulsePhase * 0.05) * 0.05;
    ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// P1: Le Reve inspired — warm split face
function drawCubistFaceWarm(r, isActive, color, colorLight) {
  var lw = Math.max(1.5, r * 0.08);
  // Head shape
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.bezierCurveTo(r * 0.7, -r * 0.9, r * 0.85, -r * 0.3, r * 0.75, r * 0.2);
  ctx.bezierCurveTo(r * 0.65, r * 0.7, r * 0.3, r * 0.95, 0, r * 0.9);
  ctx.bezierCurveTo(-r * 0.4, r * 0.95, -r * 0.7, r * 0.5, -r * 0.8, 0);
  ctx.bezierCurveTo(-r * 0.85, -r * 0.5, -r * 0.6, -r * 0.9, 0, -r * 0.95);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  // Split: lighter right half + rose cheek
  ctx.save(); ctx.clip();
  ctx.fillStyle = colorLight;
  ctx.fillRect(0, -r, r, r * 2);
  ctx.fillStyle = '#c9917a';
  ctx.beginPath(); ctx.moveTo(r*0.1,r*0.1); ctx.lineTo(r*0.6,r*0.3); ctx.lineTo(r*0.2,r*0.65); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Bold outline
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.bezierCurveTo(r * 0.7, -r * 0.9, r * 0.85, -r * 0.3, r * 0.75, r * 0.2);
  ctx.bezierCurveTo(r * 0.65, r * 0.7, r * 0.3, r * 0.95, 0, r * 0.9);
  ctx.bezierCurveTo(-r * 0.4, r * 0.95, -r * 0.7, r * 0.5, -r * 0.8, 0);
  ctx.bezierCurveTo(-r * 0.85, -r * 0.5, -r * 0.6, -r * 0.9, 0, -r * 0.95);
  ctx.closePath(); ctx.stroke();
  // Face split line
  ctx.beginPath(); ctx.moveTo(r*0.05,-r*0.8); ctx.quadraticCurveTo(r*0.1,0,0,r*0.85);
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw * 0.7; ctx.stroke();
  // Left eye (almond, front view)
  ctx.fillStyle = '#fffef0'; ctx.beginPath();
  ctx.ellipse(-r*0.3, -r*0.2, r*0.2, r*0.12, -0.1, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.6; ctx.stroke();
  ctx.fillStyle = '#2c1810'; ctx.beginPath(); ctx.arc(-r*0.28,-r*0.2,r*0.06,0,Math.PI*2); ctx.fill();
  // Right eye (circle, profile — displaced upward)
  ctx.fillStyle = '#fffef0'; ctx.beginPath();
  ctx.ellipse(r*0.25, -r*0.35, r*0.15, r*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.6; ctx.stroke();
  ctx.fillStyle = '#2c1810'; ctx.beginPath(); ctx.arc(r*0.28,-r*0.35,r*0.055,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.7;
  ctx.beginPath(); ctx.moveTo(-r*0.05,-r*0.15); ctx.lineTo(-r*0.15,r*0.15); ctx.lineTo(r*0.05,r*0.2); ctx.stroke();
  // Mouth
  ctx.strokeStyle = '#c13b2a'; ctx.lineWidth = lw*0.6;
  ctx.beginPath(); ctx.moveTo(-r*0.2,r*0.45); ctx.quadraticCurveTo(-r*0.05,r*0.55,r*0.15,r*0.42); ctx.stroke();
}

// P2: Weeping Woman inspired — cool angular face
function drawCubistFaceCool(r, isActive, color, colorLight) {
  var lw = Math.max(1.5, r * 0.08);
  // Angular head
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.lineTo(r * 0.75, -r * 0.3);
  ctx.quadraticCurveTo(r * 0.8, r * 0.2, r * 0.5, r * 0.7);
  ctx.lineTo(0, r * 0.9);
  ctx.lineTo(-r * 0.5, r * 0.7);
  ctx.quadraticCurveTo(-r * 0.85, r * 0.1, -r * 0.7, -r * 0.35);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  // Split tones
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#1e3566';
  ctx.fillRect(-r, -r, r * 1.05, r * 2);
  ctx.fillStyle = '#5c3d7a';
  ctx.beginPath(); ctx.moveTo(-r*0.4,-r*0.1); ctx.lineTo(-r*0.1,r*0.5); ctx.lineTo(-r*0.6,r*0.4); ctx.closePath(); ctx.fill();
  ctx.restore();
  // Bold outline
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.lineTo(r * 0.75, -r * 0.3);
  ctx.quadraticCurveTo(r * 0.8, r * 0.2, r * 0.5, r * 0.7);
  ctx.lineTo(0, r * 0.9);
  ctx.lineTo(-r * 0.5, r * 0.7);
  ctx.quadraticCurveTo(-r * 0.85, r * 0.1, -r * 0.7, -r * 0.35);
  ctx.closePath(); ctx.stroke();
  // Face split
  ctx.beginPath(); ctx.moveTo(r*0.05,-r*0.85); ctx.lineTo(-r*0.05,r*0.1); ctx.lineTo(r*0.05,r*0.8);
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.6; ctx.stroke();
  // Left eye (diamond — Weeping Woman)
  ctx.fillStyle = '#fffef0'; ctx.beginPath();
  ctx.moveTo(-r*0.45,-r*0.2); ctx.lineTo(-r*0.25,-r*0.35); ctx.lineTo(-r*0.05,-r*0.2); ctx.lineTo(-r*0.25,-r*0.08);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.6; ctx.stroke();
  ctx.fillStyle = '#2c1810'; ctx.beginPath(); ctx.arc(-r*0.25,-r*0.2,r*0.05,0,Math.PI*2); ctx.fill();
  // Right eye (wider, displaced up)
  ctx.fillStyle = '#fffef0'; ctx.beginPath();
  ctx.moveTo(r*0.1,-r*0.4); ctx.lineTo(r*0.35,-r*0.5); ctx.lineTo(r*0.5,-r*0.35); ctx.lineTo(r*0.3,-r*0.25);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.6; ctx.stroke();
  ctx.fillStyle = '#2c1810'; ctx.beginPath(); ctx.arc(r*0.32,-r*0.37,r*0.045,0,Math.PI*2); ctx.fill();
  // Tear line
  ctx.strokeStyle = '#4a6bb5'; ctx.lineWidth = lw*0.4;
  ctx.beginPath(); ctx.moveTo(-r*0.25,-r*0.08); ctx.quadraticCurveTo(-r*0.3,r*0.15,-r*0.2,r*0.25); ctx.stroke();
  // Nose (sharp angular)
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.7;
  ctx.beginPath(); ctx.moveTo(r*0.05,-r*0.15); ctx.lineTo(r*0.2,r*0.1); ctx.lineTo(0,r*0.2); ctx.lineTo(-r*0.1,r*0.1); ctx.stroke();
  // Mouth + teeth hints
  ctx.strokeStyle = '#2c1810'; ctx.lineWidth = lw*0.5;
  ctx.beginPath(); ctx.moveTo(-r*0.2,r*0.45); ctx.lineTo(-r*0.05,r*0.5); ctx.lineTo(r*0.15,r*0.43); ctx.stroke();
  for (var ti = 0; ti < 3; ti++) { var tx = -r*0.15 + ti*r*0.12; ctx.beginPath(); ctx.moveTo(tx,r*0.44); ctx.lineTo(tx,r*0.5); ctx.stroke(); }
}

// ============ UI ============
function renderWallPips(id, count) {
  var el = document.getElementById(id);
  el.innerHTML = '<span class="wall-label">' + count + '</span>';
  el.classList.toggle('wall-count-zero', count === 0);

function createRoom() {
  if (!myUid) { showOnlineError('認証中…少し待ってください'); return; }
  var code = String(Math.floor(1000 + Math.random() * 9000));
  db.ref('rooms/' + code).once('value').then(function(snap) {
    if (snap.exists()) {
      // Collision, try again
      createRoom();
      return;
    }
    roomCode = code;
    db.ref('rooms/' + code).set({
      host: myUid,
      guest: null,
      state: null,
      status: 'waiting',
      createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(function() {
      // Auto-remove room on disconnect
      db.ref('rooms/' + code).onDisconnect().remove();
      document.getElementById('online-menu').style.display = 'none';
      document.getElementById('waiting-room').style.display = '';
      document.getElementById('display-room-code').textContent = code;
      // Listen for guest joining
      presenceListener = db.ref('rooms/' + code + '/guest').on('value', function(gSnap) {
        if (gSnap.val()) {
          db.ref('rooms/' + code + '/guest').off('value', presenceListener);
          presenceListener = null;
          startOnlineGame(0);
        }
      });
    }).catch(function(err) {
      showOnlineError('部屋の作成に失敗: ' + err.message);
    });
  });
}

function joinRoom() {
  if (!myUid) { showOnlineError('認証中…少し待ってください'); return; }
  var code = document.getElementById('room-code-input').value.trim();
  if (code.length !== 4 || !/^\d{4}$/.test(code)) {
    showOnlineError('4桁の数字を入力してください');
    return;
  }
  db.ref('rooms/' + code).once('value').then(function(snap) {
    if (!snap.exists()) {
      showOnlineError('この部屋は存在しません');
      return;
    }
    var room = snap.val();
    if (room.status !== 'waiting') {
      showOnlineError('この部屋は既にゲーム中です');
      return;
    }
    roomCode = code;
    db.ref('rooms/' + code).update({
      guest: myUid,
      status: 'playing'
    }).then(function() {
      startOnlineGame(1);
    }).catch(function(err) {
      showOnlineError('参加に失敗: ' + err.message);
    });
  });
}

function cancelRoom() {
  if (presenceListener) {
    db.ref('rooms/' + roomCode + '/guest').off('value', presenceListener);
    presenceListener = null;
  }
  if (roomCode) {
    db.ref('rooms/' + roomCode).onDisconnect().cancel();
    db.ref('rooms/' + roomCode).remove();
    roomCode = '';
  }
  showOnlineMenu();
}

function leaveRoom() {
  if (stateListener) {
    if (roomRef) roomRef.child('state').off('value', stateListener);
    stateListener = null;
  }
  if (presenceListener) {
    if (roomCode) db.ref('rooms/' + roomCode + '/guest').off('value', presenceListener);
    presenceListener = null;
  }
  if (roomRef) {
    roomRef.onDisconnect().cancel();
    roomRef.child('status').set('ended');
    roomRef = null;
  }
  document.getElementById('disconnect-banner').style.display = 'none';
  gameMode = 'local';
  myPlayerIndex = -1;
  roomCode = '';
}

// ============ ONLINE GAME START & SYNC ============
function startOnlineGame(playerIndex) {
  gameMode = 'online';
  myPlayerIndex = playerIndex;
  roomRef = db.ref('rooms/' + roomCode);
  var n1 = document.getElementById('name-p1').value.trim() || 'Player 1';
  document.getElementById('start-overlay').classList.add('hidden');
  initAudio(); initState(); gameStarted = true;
  document.getElementById('p1-name').textContent = n1;
  document.getElementById('p2-name').textContent = 'Online';
  // Guest sees the board flipped
  if (myPlayerIndex === 1) {
    canvas.classList.add('guest-flip');
  } else {
    canvas.classList.remove('guest-flip');
  }
  resizeBoard(); showMsg(''); updateUI(); draw();
  // Host writes initial state, then both listen
  if (myPlayerIndex === 0) {
    syncStateToFirebase();
    // Cancel auto-remove since game started
    roomRef.onDisconnect().cancel();
  }
  startStateListener();
  startTurnTimer(); startAnimLoop();
  monitorConnection();
  monitorOpponent();
}

function syncStateToFirebase() {
  if (gameMode !== 'online' || !roomRef) return;
  roomRef.child('state').set({
    players: players,
    walls: walls,
    wallCounts: wallCounts,
    currentPlayer: currentPlayer,
    gameOver: gameOver,
    winner: gameOver ? (players[0].row === 0 ? 0 : 1) : -1,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });
}

function startStateListener() {
  stateListener = roomRef.child('state').on('value', function(snap) {
    var s = snap.val();
    if (!s) return;
    // Apply remote state when it's my turn (opponent just played) or game over
    if (s.currentPlayer === myPlayerIndex || s.gameOver) {
      applyRemoteState(s);
    }
  });
}

function applyRemoteState(s) {
  players = s.players;
  walls = s.walls || [];
  wallCounts = s.wallCounts;
  var prevPlayer = currentPlayer;
  currentPlayer = s.currentPlayer;
  mode = 'move'; hoverWall = null;
  undoSnapshot = null; // 相手が動いたのでUNDOできない
  updateUI(); draw();
  if (s.gameOver && s.winner >= 0) {
    gameOver = true;
    showWinner(s.winner);
  } else if (prevPlayer !== currentPlayer) {
    clearInterval(timerInterval);
    startTurnTimer();
  }
}

function monitorConnection() {
  var connRef = db.ref('.info/connected');
  connRef.on('value', function(snap) {
    if (gameMode !== 'online') return;
    var banner = document.getElementById('disconnect-banner');
    if (snap.val() === true) {
      banner.style.display = 'none';
    } else {
      banner.style.display = '';
    }
  });
}

function monitorOpponent() {
  if (!roomRef) return;
  roomRef.child('status').on('value', function(snap) {
    var status = snap.val();
    if (status === 'ended' && gameMode === 'online' && !gameOver) {
      showMsg('相手が退出しました');
      gameOver = true;
      clearInterval(timerInterval);

// BFS shortest path for a given player with a given wall list
function aiShortestPath(pRow, pCol, goalRow, wallList) {
  var visited = [];
  for (var i = 0; i < GRID; i++) { visited[i] = []; for (var j = 0; j < GRID; j++) visited[i][j] = false; }
  var queue = [{ row: pRow, col: pCol, dist: 0 }];
  visited[pRow][pCol] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  while (queue.length) {
    var cur = queue.shift();
    if (cur.row === goalRow) return cur.dist;
    for (var d = 0; d < 4; d++) {
      var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
      if (visited[nr][nc]) continue;
      var dr = nr - cur.row, dc = nc - cur.col, blocked = false;
      for (var k = 0; k < wallList.length; k++) {
        var w = wallList[k];
        if (dr===-1&&dc===0&&w.orient==='h'&&w.row===cur.row-1&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dr===1&&dc===0&&w.orient==='h'&&w.row===cur.row&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dc===-1&&dr===0&&w.orient==='v'&&w.col===cur.col-1&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
        if (dc===1&&dr===0&&w.orient==='v'&&w.col===cur.col&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
      }
      if (blocked) continue;
      visited[nr][nc] = true;
      queue.push({ row: nr, col: nc, dist: cur.dist + 1 });
    }
  }
  return 999;
}

// BFS path (returns array of cells from start to goal)
function bfsPath(pIdx, wallList) {
  var goalRow = pIdx === 0 ? 0 : 8;
  var start = players[pIdx];
  var visited = [];
  var prev = [];
  for (var i = 0; i < GRID; i++) { visited[i] = []; prev[i] = []; for (var j = 0; j < GRID; j++) { visited[i][j] = false; prev[i][j] = null; } }
  var queue = [{ row: start.row, col: start.col }];
  visited[start.row][start.col] = true;
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var found = null;
  while (queue.length) {
    var cur = queue.shift();
    if (cur.row === goalRow) { found = cur; break; }
    for (var d = 0; d < 4; d++) {
      var nr = cur.row + dirs[d][0], nc = cur.col + dirs[d][1];
      if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
      if (visited[nr][nc]) continue;
      var dr = nr - cur.row, dc = nc - cur.col, blocked = false;
      for (var k = 0; k < wallList.length; k++) {
        var w = wallList[k];
        if (dr===-1&&dc===0&&w.orient==='h'&&w.row===cur.row-1&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dr===1&&dc===0&&w.orient==='h'&&w.row===cur.row&&(w.col===cur.col||w.col===cur.col-1)){blocked=true;break;}
        if (dc===-1&&dr===0&&w.orient==='v'&&w.col===cur.col-1&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
        if (dc===1&&dr===0&&w.orient==='v'&&w.col===cur.col&&(w.row===cur.row||w.row===cur.row-1)){blocked=true;break;}
      }
      if (blocked) continue;
      visited[nr][nc] = true;
      prev[nr][nc] = { row: cur.row, col: cur.col };
      queue.push({ row: nr, col: nc });
    }
  }
  if (!found) return [];
  var path = [];
  var c = found;
  while (c) { path.unshift({ row: c.row, col: c.col }); c = prev[c.row][c.col]; }
  return path;
}

// Get smart wall candidates - walls near opponent's shortest path
function getSmartWallCandidates() {
  var humanIdx = 1 - aiPlayer;
  var path = bfsPath(humanIdx, walls);
  var candidates = [];
  var seen = {};
  for (var i = 0; i < path.length - 1; i++) {
    var r1 = path[i].row, c1 = path[i].col;
    var r2 = path[i+1].row, c2 = path[i+1].col;
    var dr = r2 - r1, dc = c2 - c1;
    // moving vertically (up or down) -> horizontal wall blocks
    if (dc === 0) {
      var wr = dr === 1 ? r1 : r2; // wall row: between the two cells
      for (var wc = Math.max(0, c1 - 1); wc <= Math.min(GRID - 2, c1); wc++) {
        var key = wr + ',' + wc + ',h';
        if (!seen[key]) { seen[key] = true; candidates.push({ row: wr, col: wc, orient: 'h' }); }
      }
    }
    // moving horizontally (left or right) -> vertical wall blocks
    if (dr === 0) {
      var wc2 = dc === 1 ? c1 : c2;
      for (var wr2 = Math.max(0, r1 - 1); wr2 <= Math.min(GRID - 2, r1); wr2++) {
        var key2 = wr2 + ',' + wc2 + ',v';
        if (!seen[key2]) { seen[key2] = true; candidates.push({ row: wr2, col: wc2, orient: 'v' }); }
      }
    }
  }
  // Also add walls near AI's path for defensive play
  var aiPath = bfsPath(aiPlayer, walls);
  for (var j = 0; j < aiPath.length - 1; j++) {
    var ar1 = aiPath[j].row, ac1 = aiPath[j].col;
    var ar2 = aiPath[j+1].row, ac2 = aiPath[j+1].col;
    // Add nearby intersections
    for (var or2 = Math.max(0, Math.min(ar1,ar2) - 1); or2 <= Math.min(GRID - 2, Math.max(ar1,ar2)); or2++) {
      for (var oc2 = Math.max(0, Math.min(ac1,ac2) - 1); oc2 <= Math.min(GRID - 2, Math.max(ac1,ac2)); oc2++) {
        var keyH = or2 + ',' + oc2 + ',h';
        var keyV = or2 + ',' + oc2 + ',v';
        if (!seen[keyH]) { seen[keyH] = true; candidates.push({ row: or2, col: oc2, orient: 'h' }); }
        if (!seen[keyV]) { seen[keyV] = true; candidates.push({ row: or2, col: oc2, orient: 'v' }); }
      }
    }
  }
  return candidates;
}

// AI evaluation function
function aiEvaluate(wallList, wCounts, plyrs) {
  var aiGoal = aiPlayer === 0 ? 0 : 8;
  var humanGoal = aiPlayer === 0 ? 8 : 0;
  var humanIdx = 1 - aiPlayer;
  var aiDist = aiShortestPath(plyrs[aiPlayer].row, plyrs[aiPlayer].col, aiGoal, wallList);
  var humanDist = aiShortestPath(plyrs[humanIdx].row, plyrs[humanIdx].col, humanGoal, wallList);
  return (humanDist - aiDist) + (wCounts[aiPlayer] - wCounts[humanIdx]) * 0.3;
}

// Minimax with alpha-beta pruning (depth 2)
function aiMinimax(depth, isMaximizing, alpha, beta, wallList, wCounts, plyrs) {
  var aiGoal = aiPlayer === 0 ? 0 : 8;
  var humanGoal = aiPlayer === 0 ? 8 : 0;
  var humanIdx = 1 - aiPlayer;
  // Terminal check
  if (plyrs[aiPlayer].row === aiGoal) return 9999;
  if (plyrs[humanIdx].row === humanGoal) return -9999;
  if (depth === 0) return aiEvaluate(wallList, wCounts, plyrs);

  var currentIdx = isMaximizing ? aiPlayer : humanIdx;
  var oppIdx = 1 - currentIdx;
  var bestScore = isMaximizing ? -Infinity : Infinity;

  // Move candidates
  var row = plyrs[currentIdx].row, col = plyrs[currentIdx].col;
  var opp = plyrs[oppIdx];
  var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  var moves = [];
  for (var d = 0; d < 4; d++) {
    var dr = dirs[d][0], dc = dirs[d][1], nr = row + dr, nc = col + dc;
    if (nr < 0 || nr >= GRID || nc < 0 || nc >= GRID) continue;
    // Check wall blocking
    var bk = false;
    for (var k = 0; k < wallList.length; k++) {
      var w = wallList[k];
      if (dr===-1&&dc===0&&w.orient==='h'&&w.row===row-1&&(w.col===col||w.col===col-1)){bk=true;break;}
      if (dr===1&&dc===0&&w.orient==='h'&&w.row===row&&(w.col===col||w.col===col-1)){bk=true;break;}
      if (dc===-1&&dr===0&&w.orient==='v'&&w.col===col-1&&(w.row===row||w.row===row-1)){bk=true;break;}
      if (dc===1&&dr===0&&w.orient==='v'&&w.col===col&&(w.row===row||w.row===row-1)){bk=true;break;}
    }
    if (bk) continue;
    if (opp.row === nr && opp.col === nc) {
      var jr = nr + dr, jc = nc + dc;
      if (jr >= 0 && jr < GRID && jc >= 0 && jc < GRID) {
        var jbk = false;
        for (var k2 = 0; k2 < wallList.length; k2++) {
          var w2 = wallList[k2]; var jdr = jr-nr, jdc = jc-nc;
          if (jdr===-1&&jdc===0&&w2.orient==='h'&&w2.row===nr-1&&(w2.col===nc||w2.col===nc-1)){jbk=true;break;}
          if (jdr===1&&jdc===0&&w2.orient==='h'&&w2.row===nr&&(w2.col===nc||w2.col===nc-1)){jbk=true;break;}
          if (jdc===-1&&jdr===0&&w2.orient==='v'&&w2.col===nc-1&&(w2.row===nr||w2.row===nr-1)){jbk=true;break;}
          if (jdc===1&&jdr===0&&w2.orient==='v'&&w2.col===nc&&(w2.row===nr||w2.row===nr-1)){jbk=true;break;}
        }
        if (!jbk) moves.push({ row: jr, col: jc });
        else {
          for (var d2 = 0; d2 < 4; d2++) {
            if (dirs[d2][0]===-dr && dirs[d2][1]===-dc) continue;
            var djr=nr+dirs[d2][0],djc=nc+dirs[d2][1];
            if (djr<0||djr>=GRID||djc<0||djc>=GRID) continue;
            var djbk=false;
            for (var k3=0;k3<wallList.length;k3++){var w3=wallList[k3];var ddr=djr-nr,ddc=djc-nc;
              if(ddr===-1&&ddc===0&&w3.orient==='h'&&w3.row===nr-1&&(w3.col===nc||w3.col===nc-1)){djbk=true;break;}
              if(ddr===1&&ddc===0&&w3.orient==='h'&&w3.row===nr&&(w3.col===nc||w3.col===nc-1)){djbk=true;break;}
              if(ddc===-1&&ddr===0&&w3.orient==='v'&&w3.col===nc-1&&(w3.row===nr||w3.row===nr-1)){djbk=true;break;}
              if(ddc===1&&ddr===0&&w3.orient==='v'&&w3.col===nc&&(w3.row===nr||w3.row===nr-1)){djbk=true;break;}
            }
            if (!djbk) moves.push({ row: djr, col: djc });
          }
        }
      } else {
        for (var d3 = 0; d3 < 4; d3++) {
          if (dirs[d3][0]===-dr && dirs[d3][1]===-dc) continue;
          var djr2=nr+dirs[d3][0],djc2=nc+dirs[d3][1];
          if (djr2<0||djr2>=GRID||djc2<0||djc2>=GRID) continue;
          var djbk2=false;
          for (var k4=0;k4<wallList.length;k4++){var w4=wallList[k4];var ddr2=djr2-nr,ddc2=djc2-nc;
            if(ddr2===-1&&ddc2===0&&w4.orient==='h'&&w4.row===nr-1&&(w4.col===nc||w4.col===nc-1)){djbk2=true;break;}
            if(ddr2===1&&ddc2===0&&w4.orient==='h'&&w4.row===nr&&(w4.col===nc||w4.col===nc-1)){djbk2=true;break;}
            if(ddc2===-1&&ddr2===0&&w4.orient==='v'&&w4.col===nc-1&&(w4.row===nr||w4.row===nr-1)){djbk2=true;break;}
            if(ddc2===1&&ddr2===0&&w4.orient==='v'&&w4.col===nc&&(w4.row===nr||w4.row===nr-1)){djbk2=true;break;}
          }
          if (!djbk2) moves.push({ row: djr2, col: djc2 });
        }
      }
    } else { moves.push({ row: nr, col: nc }); }
  }

  // Evaluate moves
  for (var mi = 0; mi < moves.length; mi++) {
    var savedRow = plyrs[currentIdx].row, savedCol = plyrs[currentIdx].col;
    plyrs[currentIdx] = { row: moves[mi].row, col: moves[mi].col };
    var score = aiMinimax(depth - 1, !isMaximizing, alpha, beta, wallList, wCounts, plyrs);
    plyrs[currentIdx] = { row: savedRow, col: savedCol };
    if (isMaximizing) {
      if (score > bestScore) bestScore = score;
      if (bestScore > alpha) alpha = bestScore;
    } else {
      if (score < bestScore) bestScore = score;
      if (bestScore < beta) beta = bestScore;
    }
    if (beta <= alpha) break;
  }

  return bestScore;
}

// AI main turn function
function aiTurn() {
  if (!aiMode || currentPlayer !== aiPlayer || gameOver) return;
  aiThinking = true;
  showMsg('AI思考中...');

  setTimeout(function() {
    var bestScore = -Infinity;
    var bestAction = null;
    var aiGoal = aiPlayer === 0 ? 0 : 8;

    // 1. Evaluate move candidates with minimax depth 2
    var moves = getValidMoves(aiPlayer);
    for (var i = 0; i < moves.length; i++) {
      var savedPos = { row: players[aiPlayer].row, col: players[aiPlayer].col };
      var plyrs = [{ row: players[0].row, col: players[0].col }, { row: players[1].row, col: players[1].col }];
      plyrs[aiPlayer] = { row: moves[i].row, col: moves[i].col };
      // Instant win
      if (moves[i].row === aiGoal) {
        bestScore = 99999;
        bestAction = { type: 'move', row: moves[i].row, col: moves[i].col };
        break;
      }
      var score = aiMinimax(1, false, -Infinity, Infinity, walls, wallCounts, plyrs);
      if (score > bestScore) {
        bestScore = score;
        bestAction = { type: 'move', row: moves[i].row, col: moves[i].col };
      }
    }

    // 2. Evaluate wall candidates (only if walls remaining and no instant win)
    if (wallCounts[aiPlayer] > 0 && bestScore < 99999) {
      var wallCands = getSmartWallCandidates();
      for (var j = 0; j < wallCands.length; j++) {
        var wc = wallCands[j];
        if (!canPlaceWall(wc.row, wc.col, wc.orient)) continue;
        // Simulate wall placement
        walls.push(wc);
        var wCounts = [wallCounts[0], wallCounts[1]];
        wCounts[aiPlayer]--;
        var plyrs2 = [{ row: players[0].row, col: players[0].col }, { row: players[1].row, col: players[1].col }];
        var wScore = aiMinimax(1, false, -Infinity, Infinity, walls, wCounts, plyrs2);
        walls.pop();
        if (wScore > bestScore) {
          bestScore = wScore;
          bestAction = { type: 'wall', row: wc.row, col: wc.col, orient: wc.orient };
        }
      }
    }

    // 3. Execute best action
    aiThinking = false;
    executeAIAction(bestAction);
  }, 300);
}

function executeAIAction(action) {
  if (!action) return;
  saveSnapshot();
  if (action.type === 'move') {
    spawnMoveTrail(players[aiPlayer].col, players[aiPlayer].row, aiPlayer);
    players[aiPlayer].row = action.row;
    players[aiPlayer].col = action.col;
    playMoveSFX(); haptic(30); showMsg('');
    var aiGoal = aiPlayer === 0 ? 0 : 8;
    if (players[aiPlayer].row === aiGoal) {
      gameOver = true; draw(); updateUI(); showWinner(aiPlayer); return;
    }
  } else {
    walls.push({ row: action.row, col: action.col, orient: action.orient });
    wallCounts[aiPlayer]--;
    spawnWallImpact(walls[walls.length - 1]);
    playWallSFX(); haptic([50,30,50]); showMsg(''); mode = 'move'; hoverWall = null;
  }
  currentPlayer = 1 - currentPlayer; playTurnChangeSFX();
  updateUI(); draw(); startTurnTimer();
}

// ============ TOUCH & POINTER ============
function getCanvasPos(e) {
  var rect = canvas.getBoundingClientRect(), scaleX = BOARD_PX / rect.width, scaleY = BOARD_PX / rect.height;
  var clientX, clientY;
  if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  var px = (clientX - rect.left) * scaleX, py = (clientY - rect.top) * scaleY;
  // Guest side: invert coords because canvas is CSS-rotated 180deg
  if (gameMode === 'online' && myPlayerIndex === 1) {
    px = BOARD_PX - px; py = BOARD_PX - py;
  }
  return { px: px, py: py };
}

function handleBoardAction(px, py) {
  if (gameOver || !gameStarted) return; ensureAudioResumed();
  if (gameMode === 'online' && currentPlayer !== myPlayerIndex) { showMsg('相手のターンです'); return; }
  if (aiMode && (currentPlayer === aiPlayer || aiThinking)) { showMsg('AIのターンです'); return; }
  if (mode === 'move') {
    var cell = pixelToCell(px, py); if (!cell) return;
    var moves = getValidMoves(currentPlayer);
    var match = null; for (var i = 0; i < moves.length; i++) { if (moves[i].row === cell.row && moves[i].col === cell.col) { match = moves[i]; break; } }
    if (!match) { showMsg('INVALID MOVE'); playInvalidSFX(); flashBoardInvalid(); haptic(100); return; }
    saveSnapshot();
    spawnMoveTrail(players[currentPlayer].col, players[currentPlayer].row, currentPlayer);
    players[currentPlayer].row = match.row; players[currentPlayer].col = match.col; playMoveSFX(); haptic(30); showMsg('');
    if (currentPlayer === 0 && players[0].row === 0) { gameOver = true; draw(); updateUI(); if (gameMode === 'online') syncStateToFirebase(); showWinner(0); return; }
    if (currentPlayer === 1 && players[1].row === 8) { gameOver = true; draw(); updateUI(); if (gameMode === 'online') syncStateToFirebase(); showWinner(1); return; }
    currentPlayer = 1 - currentPlayer; playTurnChangeSFX(); updateUI(); draw(); startTurnTimer();
    if (gameMode === 'online') syncStateToFirebase();
    if (aiMode && currentPlayer === aiPlayer) { setTimeout(function() { aiTurn(); }, 100); }
  } else {
    var slot = pixelToWallSlot(px, py); if (!slot) { showMsg('交差点の近くをタップ'); playInvalidSFX(); flashBoardInvalid(); haptic(100); return; }
    if (wallCounts[currentPlayer] <= 0) { showMsg('NO WALLS LEFT'); playInvalidSFX(); flashBoardInvalid(); haptic(100); return; }
    var autoOrient = orientation;
    if (!canPlaceWall(slot.row, slot.col, autoOrient)) {
      showMsg('CANNOT PLACE'); playInvalidSFX(); flashBoardInvalid(); haptic(100); return;
    }
    saveSnapshot();
    walls.push({ row: slot.row, col: slot.col, orient: autoOrient }); wallCounts[currentPlayer]--;
    spawnWallImpact(walls[walls.length - 1]);
    playWallSFX(); haptic([50,30,50]); showMsg(''); mode = 'move'; hoverWall = null;
    currentPlayer = 1 - currentPlayer; playTurnChangeSFX(); updateUI(); draw(); startTurnTimer();
    if (gameMode === 'online') syncStateToFirebase();
    if (aiMode && currentPlayer === aiPlayer) { setTimeout(function() { aiTurn(); }, 100); }
  }
}

canvas.addEventListener('click', function(e) { var pos = getCanvasPos(e); handleBoardAction(pos.px, pos.py); });
canvas.addEventListener('mousemove', function(e) {
  if (gameOver) { if (hoverWall || hoverCell) { hoverWall = null; hoverCell = null; draw(); } return; }
  var pos = getCanvasPos(e);
  if (mode === 'move') {
    hoverWall = null;
    var cell = pixelToCell(pos.px, pos.py);
    if (cell) {
      var moves = getValidMoves(currentPlayer);
      var valid = false;
      for (var i = 0; i < moves.length; i++) { if (moves[i].row === cell.row && moves[i].col === cell.col) { valid = true; break; } }
      hoverCell = valid ? cell : null;
    } else { hoverCell = null; }
    draw();
  } else if (mode === 'wall') {
    hoverCell = null;
    var slot = pixelToWallSlot(pos.px, pos.py);
    if (slot) { hoverWall = { row: slot.row, col: slot.col, orient: orientation }; } else { hoverWall = null; }
    draw();
  }
});
canvas.addEventListener('mouseleave', function() { hoverWall = null; hoverCell = null; draw(); });

var touchStartPos = null;
canvas.addEventListener('touchstart', function(e) { e.preventDefault(); touchStartPos = getCanvasPos(e); }, { passive: false });
canvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (mode === 'wall' && !gameOver) { var pos = getCanvasPos(e); var slot = pixelToWallSlot(pos.px, pos.py); if (slot) { hoverWall = { row: slot.row, col: slot.col, orient: orientation }; } else { hoverWall = null; } draw(); } }, { passive: false });
canvas.addEventListener('touchend', function(e) { e.preventDefault(); if (!touchStartPos) return; var endPos = getCanvasPos(e); var dx = endPos.px - touchStartPos.px; var dy = endPos.py - touchStartPos.py; if (Math.abs(dx) < CELL * 1.5 && Math.abs(dy) < CELL * 1.5) { handleBoardAction(endPos.px, endPos.py); } hoverWall = null; touchStartPos = null; draw(); }, { passive: false });
canvas.addEventListener('touchcancel', function() { hoverWall = null; touchStartPos = null; draw(); });
document.addEventListener('touchmove', function(e) { if (e.target === canvas || canvas.contains(e.target)) e.preventDefault(); }, { passive: false });

document.addEventListener('keydown', function(e) { if (!gameStarted) return; if (e.key === 'm' || e.key === 'M') setMode('move'); if (e.key === 'h' || e.key === 'H') setMode('wall-h'); if (e.key === 'v' || e.key === 'V') setMode('wall-v'); if (e.key === 'r' || e.key === 'R') resetGame(); if (e.key === 'u' || e.key === 'U') undo(); });
(function() {
  var modes = [
    { suffix: 'move', mode: 'move' },
    { suffix: 'wall-h', mode: 'wall-h' },
    { suffix: 'wall-v', mode: 'wall-v' }
  ];
  ['p1', 'p2'].forEach(function(p) {
    modes.forEach(function(m) {
      var el = document.getElementById('btn-' + m.suffix + '-' + p);
      if (el) {
        el.addEventListener('touchstart', function(e) {
          e.preventDefault();
          setMode(m.mode);
        }, { passive: false });
      }
    });
  });
})();

var resizeTimer;
window.addEventListener('resize', function() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function() { if (gameStarted) resizeBoard(); }, 150); });
window.addEventListener('orientationchange', function() { setTimeout(function() { if (gameStarted) resizeBoard(); }, 300); });

// ============ INIT ============
// Force-clear overlays on page load (prevents stale PWA state)
(function() {
  var wo = document.getElementById('winner-overlay');
  wo.classList.remove('show');
  wo.removeAttribute('style');
  var wb = wo.querySelector('.winner-box');
  if (wb) wb.removeAttribute('style');
  var cf = wo.querySelectorAll('.confetti');
  for (var i = 0; i < cf.length; i++) cf[i].remove();
})();
initState(); resizeBoard(); updateUI(); draw();

// ============ CACHE CLEANUP & SERVICE WORKER ============
// Force-clean old caches (v1-v8) so stale cache-first SWs can't block updates
(function() {
  var CURRENT = 'quoridor-v37';
  if ('caches' in window) {
    caches.keys().then(function(keys) {
      var old = keys.filter(function(k) { return k !== CURRENT; });
      if (old.length > 0) {
        Promise.all(old.map(function(k) { return caches.delete(k); })).then(function() {
          // If we cleaned old caches, force SW update and reload
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) reg.update();
            });
          }
        });
      }
    });
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=37').then(function(reg) {
      reg.addEventListener('updatefound', function() {
        var newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'activated') location.reload();
          });
        }
      });
    }).catch(function() {});
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      location.reload();
    });
  }
})();
</script>
